    c.appendChild(row);
  }
  return c;
}

/* Health watch: symptom counts, and a nudge when something repeats. */
function healthWatch(){
  const c = el('div',{class:'card', style:'--tc:var(--c-symptom)'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 10px'},[
    el('h2',{text:'How she has been'}), el('span',{class:'rule'}),
    el('button',{class:'act', text:'Log a symptom', onclick:()=>openLogSheet('health')})
  ]));

  const evs = allEvents();
  const moods = evs.filter(e=>e.type==='mood' && e.energy).slice(0,14).reverse();
  if(moods.length>1){
    const bars = el('div',{class:'bars', style:'height:56px;margin-top:0;margin-bottom:10px'});
    moods.forEach(e=>{
      const color = e.energy<=1? 'var(--c-bad)' : e.energy===2? 'var(--c-meal)' : 'var(--c-mood)';
      bars.appendChild(el('div',{class:'bar-col'},[
        el('div',{class:'bar', style:'--bc:'+color+';height:'+(10+e.energy*9)+'px', title:(ENERGY.find(x=>x[0]===e.energy)||[,''])[1]}),
        el('span',{class:'lab', text:new Date(e.at).toLocaleDateString(undefined,{month:'numeric',day:'numeric'})})
      ]));
    });
    c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600', text:'Energy, most recent '+moods.length+' check-ins'}));
    c.appendChild(bars);
    const flat = moods.slice(-3).filter(e=>e.energy<=2).length;
    if(flat>=2) c.appendChild(el('div',{class:'banner', style:'margin-bottom:10px', html: svg('info') +
      '<span>Her last few check-ins have been flat. In a puppy this size a quiet spell alongside skipped meals is worth a call to the vet rather than a wait-and-see.</span>'}));
  }

  const cut = Date.now() - 14*864e5;
  const counts = {}, lastSeen = {};
  evs.filter(e=>e.type==='health' && new Date(e.at).getTime()>cut).forEach(e=>{
    (e.symptoms||[]).forEach(s=>{ counts[s]=(counts[s]||0)+1; if(!lastSeen[s]) lastSeen[s]=e.at; });
  });
  const keys = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!keys.length){
    c.appendChild(el('div',{class:'hint', text: moods.length>1
      ? 'Nothing logged in the last fortnight. Scratching, ear-shaking, loose stool, a skipped meal — tap Symptom the moment you notice, and this card starts spotting the repeats for you.'
      : 'Nothing logged yet. Tap Symptom when something looks off and How she seems once or twice a day, and this card turns it into something you can show a vet.'}));
    return c;
  }
  c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px', text:'Logged in the last 14 days'}));
  const maxC = counts[keys[0]];
  keys.slice(0,6).forEach(k=>{
    const label = (SYMPTOMS.find(x=>x[0]===k)||[,k])[1];
    c.appendChild(el('div',{style:'display:flex;align-items:center;gap:9px;padding:4px 0'},[
      el('span',{style:'font-size:13px;flex:0 0 48%;line-height:1.25', text:label}),
      el('span',{style:'flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden'},[
        el('span',{style:'display:block;height:100%;border-radius:4px;width:'+Math.round(100*counts[k]/maxC)+'%;background:var(--c-symptom)'})
      ]),
      el('span',{class:'count', text:counts[k]+'×'})
    ]));
  });

  const repeat = keys.filter(k=>counts[k]>=3);
  if(repeat.length){
    const names = repeat.map(k=>(SYMPTOMS.find(x=>x[0]===k)||[,k])[1].toLowerCase());
    c.appendChild(el('div',{class:'banner', style:'margin-top:10px', html: svg('info') +
      '<span>' + names.join(' and ') + ' have come up three or more times in a fortnight. That is the point where it stops being a one-off — worth mentioning at her next appointment, with this list in hand.</span>'}));
  }
  if(counts.itching || counts.licking || counts.skin){
    const foods = state.pantry.items.filter(i=>i.kind==='food').map(i=> i.brand? i.brand+' '+i.name : i.name);
    c.appendChild(el('div',{class:'hint', style:'margin-top:8px', text:'Itching in a puppy this young is more often food, fleas or a new shampoo than a true allergy.'+
      (foods.length? ' Foods on file right now: '+foods.join(', ')+'. Note the date if you switch, so the two lines can be lined up later.' : '')}));
  }
  return c;
}

function last7(){
  const out = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(dateKey(d)); }
  return out;
}
function barCard(title, color, valFn, fmt){
  const days = last7(); const vals = days.map(valFn);
  const max = Math.max.apply(null, vals.concat([1]));
  const total = vals.reduce((a,b)=>a+b,0);
  const c = el('div',{class:'card'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0'},[
    el('h2',{text:title}), el('span',{class:'rule'}),
    el('span',{class:'count', text:'avg '+fmt(total/7)+'/day'})
  ]));
  const bars = el('div',{class:'bars'});
  const today = dateKey(new Date());
  days.forEach((d,i)=>{
    const h = vals[i]? Math.max(4, Math.round(88*(vals[i]/max))) : 2;
    bars.appendChild(el('div',{class:'bar-col'+(d===today?' today':'')},[
      el('span',{class:'bar-val', text: vals[i]? fmt(vals[i]) : ''}),
      el('div',{class:'bar', style:'--bc:'+color+';height:'+h+'px'}),
      el('span',{class:'lab', text: keyToDate(d).toLocaleDateString(undefined,{weekday:'narrow'})})
    ]));
  });
  c.appendChild(bars);
  return c;
}
function pottyClockCard(){
  const cut = Date.now() - 14*864e5;
  const hours = new Array(24).fill(0), acc = new Array(24).fill(0);
  allEvents().forEach(e=>{
    if(e.type!=='potty') return;
    const t = new Date(e.at); if(t.getTime()<cut) return;
    hours[t.getHours()]++;
    if(e.where==='accident') acc[t.getHours()]++;
  });
  const max = Math.max.apply(null, hours.concat([1]));
  const c = el('div',{class:'card'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 2px'},[el('h2',{text:'When she needs to go'}),el('span',{class:'rule'}),el('span',{class:'count',text:'last 14 days'})]));
  const heat = el('div',{class:'heat'});
  for(let h=0;h<24;h++){
    const v = hours[h]/max;
    const bg = acc[h] ? 'color-mix(in srgb, var(--c-bad) '+Math.round(25+65*(acc[h]/max))+'%, var(--surface))'
                      : (v? 'color-mix(in srgb, var(--c-potty) '+Math.round(14+76*v)+'%, var(--surface))' : 'var(--surface-2)');
    heat.appendChild(el('i',{style:'background:'+bg, title:pad(h)+':00 — '+hours[h]+' break'+(hours[h]===1?'':'s')+(acc[h]?', '+acc[h]+' indoors':'')}));
  }
  c.appendChild(heat);
  c.appendChild(el('div',{class:'heat-ax'},[el('span',{text:'12a'}),el('span',{text:'6a'}),el('span',{text:'12p'}),el('span',{text:'6p'}),el('span',{text:'11p'})]));
  const hotAcc = acc.map((n,h)=>({n,h})).filter(x=>x.n).sort((a,b)=>b.n-a.n)[0];
  c.appendChild(el('div',{class:'hint', text: hotAcc
    ? 'Accidents cluster around '+((hotAcc.h%12)||12)+(hotAcc.h<12?'am':'pm')+' — worth a scheduled trip outside just before.'
    : 'Darker squares are her usual times. No indoor accidents recorded in this window.'}));
  return c;
}
function accidentFreeStreak(){
  const keys = Object.keys(state.days).filter(k=>(state.days[k].events||[]).length).sort().reverse();
  if(!keys.length) return null;
  let n = 0;
  const today = dateKey(new Date());
  for(let i=0;i<400;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = dateKey(d);
    const evs = state.days[k] && state.days[k].events || [];
    if(!evs.length){ if(k===today) continue; break; }
    if(evs.some(e=>e.type==='potty'&&e.where==='accident')) break;
    n++;
  }
  return n;
}

/* ============================ clicker ============================ */
/* Marker sound, generated rather than loaded — a box clicker is a very short
   broadband transient, so a noise burst through a bandpass is close enough and
   there is no file to fetch. Timing is the whole point of a marker, so this
   fires straight from the pointer event with nothing between. */
let AC = null;
function audioCtx(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function playClick(){
  const ctx = audioCtx(); if(!ctx) return;
  const len = Math.floor(ctx.sampleRate * 0.02);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 14);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 1.2;
  const g = ctx.createGain(); g.gain.value = 0.85;
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start();
}
function playWhistle(){
  const ctx = audioCtx(); if(!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(3600, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.28, t + 0.012);
  g.gain.setValueAtTime(0.28, t + 0.22);
  g.gain.linearRampToValueAtTime(0, t + 0.3);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.32);
}
function marker(kind){ if(kind === 'whistle') playWhistle(); else playClick(); }
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }

function clickerPref(){
  try{ return localStorage.getItem('puppy-logbook-marker') || 'click'; }catch(e){ return 'click'; }
}
function setClickerPref(v){ try{ localStorage.setItem('puppy-logbook-marker', v); }catch(e){} }

function openClicker(cue){
  let count = 0;
  const started = Date.now();
  let kind = clickerPref();
  openSheet(sheet=>{
    head(sheet, 'training', 'Clicker', 'Mark the behaviour the instant it happens, then treat. Everything you tap here rolls into one training session.');

    const cueInput = el('input',{class:'inp', id:'clkCue', list:'cueListClk', placeholder:'What are you working on?', value:cue||''});
    const list = el('datalist',{id:'cueListClk'});
    CUES.forEach(c=> list.appendChild(el('option',{value:c})));
    sheet.appendChild(list);
    sheet.appendChild(field('Working on', cueInput));

    sheet.appendChild(field('Marker', chipSet([['click','Clicker'],['whistle','Whistle']], kind, v=>{ kind = v; setClickerPref(v); marker(v); })));

    const nEl = el('div',{class:'n', text:'0'});
    const pad = el('button',{class:'pad', type:'button', 'aria-label':'Click'},[ el('div',{style:'text-align:center'},[ nEl, el('div',{class:'w', text:'tap to mark'}) ]) ]);
    const fire = (e)=>{
      e.preventDefault();
      marker(kind); buzz();
      count++; nEl.textContent = String(count);
      rate.textContent = count + (count===1? ' mark' : ' marks');
      pad.classList.remove('hit'); void pad.offsetWidth; pad.classList.add('hit');
    };
    pad.addEventListener('pointerdown', fire);
    sheet.appendChild(pad);

    const rate = el('span',{text:'0 marks'});
    const clock = el('span',{'data-elapsed': new Date(started).toISOString(), text:'0:00'});
    sheet.appendChild(el('div',{class:'clk-meta'},[ rate, clock ]));

    sheet.appendChild(el('div',{class:'hint', style:'text-align:center;margin-bottom:4px',
      text:'Turn your ringer on — the sound comes from this page, so silent mode will mute it.'}));

    const row = el('div',{class:'rowb'});
    row.appendChild(el('button',{class:'btn s', type:'button', text:'Close', onclick:closeSheet}));
    row.appendChild(el('button',{class:'btn p', type:'button', text:'Save session', onclick:()=>{
      const minutes = Math.max(1, Math.round((Date.now()-started)/60000));
      closeSheet();
      openLogSheet('training', null, {cue: cueInput.value.trim(), minutes, clicks: count});
    }}));
    sheet.appendChild(row);
  });
}

function toast(msg, actionLabel, onAction){

function chipSet(options, value, onPick){
  const box = el('div',{class:'chips'});
  let cur = value;
  options.forEach(([val,label])=>{
    const b = el('button',{type:'button', class:'chip', 'aria-pressed': cur===val, text:label, onclick:()=>{
      cur = (cur===val && val!==options[0][0]) ? cur : val;
      Array.from(box.children).forEach((c,i)=> c.setAttribute('aria-pressed', options[i][0]===cur));
      onPick(cur);
    }});
    box.appendChild(b);
  });
  return box;
}
function chipMulti(options, values, onChange){
  const box = el('div',{class:'chips'});
  const cur = new Set(values||[]);
  options.forEach(([val,label])=>{
    box.appendChild(el('button',{type:'button', class:'chip', 'aria-pressed': cur.has(val), text:label, onclick:(e)=>{
      if(cur.has(val)) cur.delete(val); else cur.add(val);
      e.currentTarget.setAttribute('aria-pressed', cur.has(val));
      onChange(Array.from(cur));
    }}));
  });
  return box;
}

}
function itemPicker(kind, draft, label){
  const items = state.pantry.items.filter(i=> kind.indexOf(i.kind)>-1);
  const sel = el('select',{class:'inp', onchange:(e)=>{
    if(e.target.value==='__new'){ e.target.value=''; openItemSheet(null, kind[0], (created)=>{ draft.itemId = created.id; }); return; }
    draft.itemId = e.target.value || null;
  }});
  sel.appendChild(el('option',{value:'', text:'— not recorded —'}));
  items.forEach(i=> sel.appendChild(el('option',{value:i.id, selected: draft.itemId===i.id, text:(i.brand? i.brand+' — ':'')+i.name})));
  sel.appendChild(el('option',{value:'__new', text:'+ Add a new one…'}));
  return field(label, sel);
}

async function startType(type){
  const T = TYPES[type];
  if(type==='accident'){
    const ev = await addEvent({type:'potty', kind:'pee', where:'accident', trigger:'unwatched'});
    if(ev) toast('Accident logged', 'Add detail', ()=>{
      const f = findEvent(ev.id); if(f) openLogSheet('potty', f.ev);
    });
    return;
  }
  if(T.mode==='timer'){
    addEvent({type, endAt:null});
    toast(T.label+' started');
    return;
  }
  openLogSheet(type);
}
async function endSession(ev){
  const endAt = new Date().toISOString();
  await patchEvent(ev.id, {endAt});
  const T = TYPES[ev.type];
  toast(T.label+' ended · '+fmtDur(new Date(endAt)-new Date(ev.at)));
  if(ev.type==='crate' || ev.type==='sleep'){
    const f = findEvent(ev.id);
    if(f) openLogSheet(ev.type, f.ev);
  }
}

function openLogSheet(type, existing, seed){
  const T = TYPES[type];
  const draft = existing ? Object.assign({}, existing) : Object.assign({type, at:new Date().toISOString()}, seed||{});
  openSheet(sheet=>{
    head(sheet, type, existing? 'Edit '+T.label.toLowerCase() : T.label, existing? null : subFor(type));
    buildFields(sheet, type, draft);
    sheet.appendChild(timeField(draft));
    sheet.appendChild(field('Note', el('textarea',{class:'inp', id:'evNote', placeholder:notePlaceholder(type), value:draft.note||'',
      oninput:e=>draft.note=e.target.value.slice(0,400)})));
    actions(sheet, async ()=>{
      closeSheet();
      if(existing){ await patchEvent(existing.id, draft); toast('Updated'); }
      else { await addEvent(draft); toast(T.label+' logged'); }
    }, existing? 'Save changes' : 'Log it', existing ? async ()=>{ closeSheet(); await removeEvent(existing.id); toast('Deleted'); } : null);
  });
}
function subFor(type){
  return {
    meal:'Which meal, what she got, and how much of it she actually ate.',
    potty:'The detail here is what makes the schedule readable later.',
    treat:'Tie it to a brand so her favourites rise to the top.',
    training:'A minute or two counts. Rate how it went while it is fresh.',
    weight:'Weekly weigh-ins are enough to see the growth curve.',
    health:'Small things logged consistently are worth more at the vet than a good memory.',
    mood:'A quick read on her energy. Two of these a day is plenty.',
    chew:'Teething runs until about six months. Log what you handed her and how long it held.',
    water:'', meds:'', groom:'', vet:'', note:''
  }[type] || '';
}
function notePlaceholder(type){
  return {
    potty:'Straining, ate grass, pulled toward the door first…',
    meal:'Slow feeder, added toppers, seemed off…',
    training:'Distractions, what clicked, what to try next time…',
    vet:'Reason for the visit, what the vet said…',
    meds:'Dose and who gave it…',
    health:'When it started, what changed beforehand, new food or treat…',
    mood:'What set it off, what she had been doing…',
    chew:'Where she took it, whether you had to swap it out…'
  }[type] || 'Anything worth remembering';
}

function buildFields(sheet, type, draft){
  if(type==='meal'){
    if(!draft.meal){ const h = new Date(draft.at).getHours(); draft.meal = h<10?'Breakfast': h<15?'Lunch': h<21?'Dinner':'Snack'; }
    sheet.appendChild(field('Which meal', chipSet([['Breakfast','Breakfast'],['Lunch','Lunch'],['Dinner','Dinner'],['Snack','Snack']], draft.meal, v=>draft.meal=v)));
    sheet.appendChild(itemPicker(['food'], draft, 'Food'));
    sheet.appendChild(field('Amount', el('input',{class:'inp', id:'mealAmt', placeholder:'e.g. 3/4 cup', value:draft.amount||'', oninput:e=>draft.amount=e.target.value.slice(0,40)})));
    if(!draft.ate) draft.ate='all';
    sheet.appendChild(field('How much did she eat', chipSet([['all','All of it'],['most','Most'],['half','About half'],['little','Barely'],['none','Refused']], draft.ate, v=>draft.ate=v)));
  }
  else if(type==='potty'){
    if(!draft.kind) draft.kind='pee';
    if(!draft.where) draft.where='outside';
    sheet.appendChild(field('What happened', chipSet([['pee','Pee'],['poop','Poop'],['both','Both']], draft.kind, v=>{ draft.kind=v; qual.hidden = (v==='pee'); })));
    sheet.appendChild(field('Where', chipSet([['outside','Outside'],['pad','On the pad'],['accident','Accident indoors']], draft.where, v=>draft.where=v)));
    if(!draft.quality) draft.quality='normal';
    const qual = field('Stool', chipSet([['normal','Normal'],['soft','Soft'],['loose','Loose'],['hard','Hard'],['blood','Blood / mucus']], draft.quality, v=>draft.quality=v),
      'Worth logging if it changes — it is the first thing a vet asks.');
    qual.hidden = (draft.kind==='pee');
    sheet.appendChild(qual);
    const trig = field('What was going on', chipSet(ACCIDENT_TRIGGERS, draft.trigger||'unwatched', v=>draft.trigger=v),
      'Accidents cluster around a handful of moments. Naming them is how the pattern shows up on the Focus tab.');
    trig.hidden = (draft.where!=='accident');
    sheet.appendChild(trig);
    const whereChips = sheet.querySelectorAll('.field')[1];
    whereChips.addEventListener('click', ()=> setTimeout(()=>{ trig.hidden = (draft.where!=='accident'); },0));
  }
  else if(type==='treat'){
    sheet.appendChild(itemPicker(['treat','chew'], draft, 'Which treat'));
    if(!draft.reaction) draft.reaction='loved';
    sheet.appendChild(field('Her reaction', chipSet([['loved','Loved it'],['liked','Liked it'],['meh','Meh'],['no','Spat it out']], draft.reaction, v=>draft.reaction=v)));
    sheet.appendChild(field('What for', chipSet([['training','Training reward'],['crate','Crate / settle'],['just','Just because'],['chew','Long chew']], draft.purpose||'training', v=>draft.purpose=v)));
  }
  else if(type==='training'){
    const list = el('datalist',{id:'cueList'});
    CUES.forEach(c=> list.appendChild(el('option',{value:c})));
    sheet.appendChild(list);
    sheet.appendChild(field('Cue or skill', el('input',{class:'inp', id:'trCue', list:'cueList', placeholder:'Sit, Place, Loose leash…', value:draft.cue||'', oninput:e=>draft.cue=e.target.value.slice(0,40)})));
    if(!draft.score) draft.score=3;
    sheet.appendChild(field('How did it go', chipSet([[5,'Nailed it'],[4,'Good'],[3,'Getting there'],[2,'Rough'],[1,'Not today']], draft.score, v=>draft.score=v)));
    sheet.appendChild(field('Minutes', el('input',{class:'inp', id:'trMin', type:'number', min:'1', max:'120', inputmode:'numeric', placeholder:'5', value:draft.minutes||'', oninput:e=>draft.minutes=e.target.value? +e.target.value : null})));
    sheet.appendChild(itemPicker(['treat'], draft, 'Treat used'));
    sheet.appendChild(field('Lesson', el('input',{class:'inp', id:'trLesson', placeholder:'Dogo week 3, day 2 — or leave blank', value:draft.lesson||'', oninput:e=>draft.lesson=e.target.value.slice(0,60)}),
      'If you are following a course, put the lesson here so the board lines up with wherever you are in it.'));
    if(!existing){
      sheet.appendChild(el('button',{class:'btn s', type:'button', style:'width:100%;margin-bottom:4px', text:'Open the clicker instead',
        onclick:()=>{ closeSheet(); openClicker(draft.cue); }}));
    }
  }
  else if(type==='health'){
    sheet.appendChild(field('What are you seeing', chipMulti(SYMPTOMS, draft.symptoms||[], v=>{
      draft.symptoms = v;
      areaF.hidden = !v.some(s=>['itching','licking','skin','ears'].indexOf(s)>-1);
    }), 'Tick everything that applies — the pattern over time is what a vet will ask for.'));
    if(!draft.severity) draft.severity='mild';
    sheet.appendChild(field('How bad', chipSet([['mild','Mild'],['noticeable','Noticeable'],['bad','Bad — worrying me']], draft.severity, v=>draft.severity=v)));
    const areaF = field('Where on her', chipMulti(BODY_AREAS, draft.areas||[], v=>draft.areas=v));
    areaF.hidden = !(draft.symptoms||[]).some(s=>['itching','licking','skin','ears'].indexOf(s)>-1);
    sheet.appendChild(areaF);
  }
  else if(type==='mood'){
    if(!draft.energy) draft.energy=3;
    sheet.appendChild(field('Energy right now', chipSet(ENERGY, draft.energy, v=>draft.energy=v),
      'Logged a couple of times a day this becomes the fastest way to notice something is off before it looks like a symptom.'));
    sheet.appendChild(field('Also', chipMulti([['clingy','Clingy'],['nippy','Nippy / mouthy'],['restless','Restless'],['hiding','Hiding away'],['vocal','Extra vocal'],['happy','Happy and settled']], draft.tags||[], v=>draft.tags=v)));
  }
  else if(type==='chew'){
    sheet.appendChild(field('What she got', chipSet(CHEW_KINDS, draft.chewKind||'kong', v=>draft.chewKind=v)));
    sheet.appendChild(itemPicker(['chew','treat'], draft, 'Saved item (optional)'));
    sheet.appendChild(field('Minutes she stayed with it', el('input',{class:'inp', type:'number', min:'0', max:'240', inputmode:'numeric', placeholder:'15',
      value: draft.minutes||'', oninput:e=> draft.minutes = e.target.value===''? null : +e.target.value}),
      'This is the number that tells you which chew is worth buying again.'));
    if(!draft.effect) draft.effect='busy';
    sheet.appendChild(field('What it did for her', chipSet(CHEW_EFFECT, draft.effect, v=>draft.effect=v)));
    sheet.appendChild(field('Teething signs', chipMulti([['gums','Sore or bloody gums'],['tooth','Lost a tooth'],['furniture','Chewing furniture'],['hands','Chewing hands / ankles'],['drool','Extra drooling']], draft.teething||[], v=>draft.teething=v)));
  }
  else if(type==='water'){
    sheet.appendChild(field('Amount', chipSet([['Full bowl','Full bowl'],['Topped up','Topped up'],['Big drink','Big drink'],['Small sip','Small sip']], draft.amount||'Topped up', v=>draft.amount=v)));
  }
  else if(type==='meds'){
    sheet.appendChild(field('What', el('input',{class:'inp', id:'medWhat', placeholder:'Flea & tick, dewormer, ear drops…', value:draft.what||'', oninput:e=>draft.what=e.target.value.slice(0,60)})));
  }
  else if(type==='weight'){
    sheet.appendChild(field('Weight ('+(state.profile.unit||'lb')+')', el('input',{class:'inp', id:'wt', type:'number', step:'0.1', min:'0', inputmode:'decimal', placeholder:'12.4', value:draft.weight||'', oninput:e=>draft.weight=e.target.value})));
  }
  else if(type==='groom'){
    sheet.appendChild(field('What', chipSet([['Bath','Bath'],['Brush','Brush'],['Nails','Nails'],['Ears','Ears'],['Teeth','Teeth'],['Groomer','Groomer']], draft.what||'Brush', v=>draft.what=v)));
  }
  else if(type==='vet'){
    sheet.appendChild(field('Visit type', chipSet([['Check-up','Check-up'],['Vaccines','Vaccines'],['Sick visit','Sick visit'],['Spay/neuter','Spay/neuter'],['Other','Other']], draft.what||'Check-up', v=>draft.what=v)));
  }
  else if(TYPES[type].mode==='timer'){
    if(type==='crate'){
      sheet.appendChild(field('Who was home', chipSet([['alone','Nobody — she was alone'],['home','Someone in the house'],['room','Someone in the room']], draft.alone||'home', v=>draft.alone=v)));
      sheet.appendChild(field('Door', chipSet([['closed','Closed'],['open','Open / gated'],['pen','Pen instead']], draft.door||'closed', v=>draft.door=v)));
      sheet.appendChild(field('How did it go', chipSet(CRATE_OUTCOMES, draft.outcome||'settled', v=>draft.outcome=v)));
      sheet.appendChild(field('Minutes until she settled', el('input',{class:'inp', type:'number', min:'0', max:'240', inputmode:'numeric', placeholder:'2',
        value: draft.settleMin===0? '0' : (draft.settleMin||''), oninput:e=> draft.settleMin = e.target.value===''? null : +e.target.value}),
        'The number that actually moves during crate training — it should fall even as the sessions get longer.'));
      sheet.appendChild(field('Did she sleep in there', chipSet(CRATE_SLEPT, draft.sleptIn||'no', v=>draft.sleptIn=v),
        'Crate sleep counts toward her daily total, so overnight goes in here rather than as a second entry.'));
    }
    if(type==='sleep'){
      sheet.appendChild(field('Where', chipSet(NAP_WHERE, draft.where||'crate', v=>draft.where=v),
        'Naps taken in the crate are the quiet half of crate training — she builds the association while asleep instead of while protesting.'));
      sheet.appendChild(field('How she went down', chipSet(NAP_SETTLED, draft.settled||'own', v=>draft.settled=v)));
    }
    sheet.appendChild(field('Ended', el('input',{class:'inp', type:'datetime-local', value: draft.endAt? localInput(new Date(draft.endAt)) : '',
      onchange:e=> draft.endAt = e.target.value? new Date(e.target.value).toISOString() : null}), 'Leave empty to keep it running.'));
    if(type==='walk') sheet.appendChild(field('Where', el('input',{class:'inp', placeholder:'Around the block, dog park…', value:draft.where||'', oninput:e=>draft.where=e.target.value.slice(0,60)})));
  }
}

function openEventSheet(e){
  openLogSheet(e.type, e);
}

function openItemSheet(existing, defaultKind, onCreated){
  const draft = existing ? Object.assign({}, existing) : {id:uid(), kind:defaultKind||'treat', brand:'', name:'', rating:4, note:'', by:(state.me&&state.me.id)||null};
  openSheet(sheet=>{
    head(sheet, draft.kind==='food'?'meal':'treat', existing? 'Edit item' : 'Add to the pantry',
      existing? null : 'Brands you save here become one-tap options when logging meals and treats.');
    sheet.appendChild(field('Type', chipSet([['food','Food'],['treat','Treat'],['chew','Chew / toy']], draft.kind, v=>draft.kind=v)));
    sheet.appendChild(field('Brand', el('input',{class:'inp', id:'itBrand', placeholder:'Purina Pro Plan, Zuke’s…', value:draft.brand||'', oninput:e=>draft.brand=e.target.value.slice(0,50)})));
    sheet.appendChild(field('Product', el('input',{class:'inp', id:'itName', placeholder:'Puppy Chicken & Rice, Mini Naturals…', value:draft.name||'', oninput:e=>draft.name=e.target.value.slice(0,70)})));
    sheet.appendChild(field('Her verdict', chipSet([[5,'Obsessed'],[4,'Likes it'],[3,'Takes it or leaves it'],[2,'Not a fan'],[1,'Upset her tummy']], draft.rating, v=>draft.rating=v)));
    sheet.appendChild(field('Notes', el('textarea',{class:'inp', id:'itNote', placeholder:'Where you buy it, price, size, whether it crumbles in a pocket…', value:draft.note||'', oninput:e=>draft.note=e.target.value.slice(0,300)})));
    actions(sheet, async ()=>{
      if(!draft.name.trim()){ toast('Give it a name first'); return; }
      closeSheet();
      const items = state.pantry.items.slice();
      const i = items.findIndex(x=>x.id===draft.id);
      if(i>-1) items[i]=draft; else items.push(draft);
      state.pantry = {items}; render();
      await savePantryItem(draft, i === -1);
      render();
      if(onCreated) onCreated(draft);
      toast(existing? 'Saved' : 'Added to the pantry');
    }, existing? 'Save' : 'Add', existing ? async ()=>{
      closeSheet();
      state.pantry = {items: state.pantry.items.filter(x=>x.id!==draft.id)};
      render(); await deletePantryItem(draft.id); toast('Removed');
    } : null);
  });
}

/* ---------- appearance ---------- */
/* Theme is per-device (your phone, your eyes); palette is shared, so the
   logbook looks like one thing in both houses. */
const PALETTES = [['moss','Moss','#0f7a5a'],['clay','Clay','#b4562c'],['dusk','Dusk','#5851c4'],['berry','Berry','#b23a6d'],['slate','Slate','#2f6f8f']];

function savedTheme(){ try{ return localStorage.getItem('same-page-theme') || 'system'; }catch(e){ return 'system'; } }
function applyTheme(mode){
  const root = document.documentElement;
  if(mode === 'system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', mode);
  try{ localStorage.setItem('same-page-theme', mode); }catch(e){}
  syncStatusBar();
}
function applyPalette(name){
  const root = document.documentElement;
  if(!name || name === 'moss') root.removeAttribute('data-palette');
  else root.setAttribute('data-palette', name);
  syncStatusBar();
}
/* Keep the iOS status bar and the Safari chrome on the same ground as the page. */
function syncStatusBar(){
  requestAnimationFrame(()=>{
    const bg = getComputedStyle(document.body).backgroundColor;
    document.querySelectorAll('meta[name="theme-color"]').forEach(m=> m.remove());
    document.head.appendChild(el('meta',{name:'theme-color', content:bg}));
  });
}
applyTheme(savedTheme());

async function uploadPhoto(file, onDone){
  if(!file || !state.dogId) return;
  if(file.size > 5*1024*1024) return toast('That photo is over 5MB — try a smaller one.');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const key = state.dogId + '/' + Date.now() + '.' + ext;
  toast('Uploading…');
  const {error} = await SB.storage.from('dog-photos').upload(key, file, {upsert:true, contentType:file.type});
  if(error) return dbError(error, 'photo upload');
  const {data} = SB.storage.from('dog-photos').getPublicUrl(key);
  state.profile.photoUrl = data.publicUrl;
  const {error:e2} = await SB.from('dogs').update({photo_url:data.publicUrl}).eq('id', state.dogId);
  if(e2) return dbError(e2, 'photo save');
  render(); if(onDone) onDone(data.publicUrl);
  toast('Photo saved');
}

function openSettings(firstRun){
  const draft = Object.assign({}, state.profile);
  openSheet(sheet=>{
    head(sheet, 'note', firstRun? 'Set up the logbook' : 'Settings', firstRun? 'Two quick things and everyone in the household is logging the same puppy.' : null);

    // photo
    const shot = el('button',{class:'shot-edit', type:'button', 'aria-label':'Change photo',
      onclick:()=> picker.click()});
    const shotImg = el('img',{alt:'', src: draft.photoUrl || '', hidden: !draft.photoUrl});
    shot.appendChild(shotImg);
    shot.appendChild(el('span',{class:'ph', text: draft.photoUrl? '' : 'Add a photo'}));
    const picker = el('input',{type:'file', accept:'image/*', hidden:true, onchange:e=>{
      const f = e.target.files && e.target.files[0];
      if(f) uploadPhoto(f, url=>{ draft.photoUrl = url; shotImg.src = url; shotImg.hidden = false; shot.querySelector('.ph').textContent=''; });
    }});
    sheet.appendChild(shot); sheet.appendChild(picker);
    sheet.appendChild(field('Her name', el('input',{class:'inp', id:'stName', placeholder:'Nala', value:draft.name||'', oninput:e=>draft.name=e.target.value.slice(0,30)})));
    sheet.appendChild(field('Birthday', el('input',{class:'inp', id:'stBday', type:'date', value:draft.birthday||'', onchange:e=>draft.birthday=e.target.value}),
      'Everything on the Focus tab is scaled to her age — an estimate is fine if you only know roughly.'));
    const breedList = el('datalist',{id:'breedList'});
    ['Shih Tzu × Yorkshire Terrier','Shih Tzu','Yorkshire Terrier','Maltese','Poodle mix','Mixed breed'].forEach(b=> breedList.appendChild(el('option',{value:b})));
    sheet.appendChild(breedList);
    sheet.appendChild(field('Breed', el('input',{class:'inp', id:'stBreed', list:'breedList', placeholder:'Shih Tzu × Yorkshire Terrier', value:draft.breed||'', oninput:e=>draft.breed=e.target.value.slice(0,60)}),
      'Naming both sides of a mix turns on the guidance for each of them.'));
    sheet.appendChild(field('Grown-up size', chipSet(Object.keys(SIZE).map(k=>[k, SIZE[k].label]), draft.size||'toy', v=>draft.size=v),
      'Toy and small breeds hold it for noticeably less time than the usual one-hour-per-month rule, so this changes her potty window.'));
    sheet.appendChild(field('Weight unit', chipSet([['lb','Pounds'],['kg','Kilograms']], draft.unit||'lb', v=>draft.unit=v)));

    sheet.appendChild(field('Appearance', chipSet([['system','Match my phone'],['light','Always light'],['dark','Always dark']],
      savedTheme(), v=>applyTheme(v)), 'Matching your phone follows iOS Dark Mode, including the automatic sunset switch.'));

    const sw = el('div',{class:'swatches'});
    PALETTES.forEach(([key,label,hex])=>{
      const b = el('button',{class:'sw-btn', type:'button', title:label, 'aria-label':label,
        'aria-pressed': (draft.theme||'moss')===key, style:'background:'+hex+'22',
        onclick:()=>{
          draft.theme = key; applyPalette(key);
          Array.from(sw.children).forEach((c,i)=> c.setAttribute('aria-pressed', PALETTES[i][0]===key));
        }});
      b.appendChild(el('i',{style:'background:'+hex}));
      sw.appendChild(b);
    });
    sheet.appendChild(field('Colour', sw, 'Shared — everyone in the household sees the one you pick.'));

    if(!firstRun && state.invite){
      const code = el('code',{text:state.invite});
      sheet.appendChild(field('Invite the rest of the household',
        el('div',{class:'invite'},[ code,
          el('button',{type:'button', text:'Copy', onclick:async ()=>{
            try{ await navigator.clipboard.writeText(state.invite); toast('Code copied'); }
            catch(e){ toast('Select the code and copy it'); }
          }})
        ]),
        'They install the app, create their own account, and enter this code to join. Same logbook, same puppy, live on both phones.'));
    }

    actions(sheet, async ()=>{
      closeSheet();
      state.profile = draft; render();
      await writeProfile();
      toast('Saved');
    }, firstRun? 'Start logging' : 'Save');

    if(!firstRun){
      sheet.appendChild(el('button',{class:'gate-alt', text:'Sign out',
        onclick: async ()=>{ closeSheet(); await SB.auth.signOut(); location.reload(); }}));
    }
  });
}
$('#settingsBtn').addEventListener('click', ()=>openSettings(false));
</script>
