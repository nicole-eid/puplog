<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101510" media="(prefers-color-scheme: dark)">
<meta name="description" content="A shared household logbook for a puppy: meals, potty, crate and alone-time training, naps, teething and commands.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Same Page">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<style>
/* Baseline the artifact host used to provide, now ours. */
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Same Page</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1ee; --surface:#ffffff; --surface-2:#f6f9f6; --line:#dce3dd; --line-strong:#c3cec6;
  --ink:#16201b; --ink-2:#4d5b53; --ink-3:#7b8981;
  --accent:#0f7a5a; --accent-ink:#0b5c44; --accent-soft:#dcefe6; --accent-on:#ffffff;
  --shadow:0 1px 2px rgba(22,32,27,.06), 0 6px 18px -12px rgba(22,32,27,.25);
  --c-meal:#c2741b; --c-water:#2f8fb3; --c-potty:#3f7fa6; --c-walk:#12805c; --c-play:#6a9c1f;
  --c-crate:#7159c1; --c-sleep:#485c99; --c-treat:#c0467e; --c-training:#8f6a12;
  --c-meds:#5b7083; --c-note:#6b7a72; --c-vet:#b03a3a; --c-groom:#a06ac0; --c-weight:#5b7083;
  --c-symptom:#b5562c; --c-mood:#2a7f8f; --c-chew:#8a6a3f;
  --c-bad:#c0392b; --c-bad-soft:#fae4e1; --c-good:#12805c;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101510; --surface:#18201b; --surface-2:#1e2721; --line:#2b352e; --line-strong:#3c483f;
  --ink:#e7efe9; --ink-2:#a8b7ae; --ink-3:#7c8b82;
  --accent:#4fc39a; --accent-ink:#8ad9ba; --accent-soft:#1b3a2d; --accent-on:#07130e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  --c-meal:#e9a25a; --c-water:#6cc2e0; --c-potty:#7db6d8; --c-walk:#4fc39a; --c-play:#a8d45e;
  --c-crate:#a795ea; --c-sleep:#93a6e0; --c-treat:#ef8cb6; --c-training:#d9b352;
  --c-meds:#9db0c2; --c-note:#a3b3aa; --c-vet:#ef8a8a; --c-groom:#cba3e4; --c-weight:#9db0c2;
  --c-symptom:#e8926a; --c-mood:#6cc3d4;
  --c-bad:#f08b7f; --c-bad-soft:#3a1f1c; --c-good:#4fc39a;
}}
:root[data-theme="dark"]{
  --bg:#101510; --surface:#18201b; --surface-2:#1e2721; --line:#2b352e; --line-strong:#3c483f;
  --ink:#e7efe9; --ink-2:#a8b7ae; --ink-3:#7c8b82;
  --accent:#4fc39a; --accent-ink:#8ad9ba; --accent-soft:#1b3a2d; --accent-on:#07130e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  --c-meal:#e9a25a; --c-water:#6cc2e0; --c-potty:#7db6d8; --c-walk:#4fc39a; --c-play:#a8d45e;
  --c-crate:#a795ea; --c-sleep:#93a6e0; --c-treat:#ef8cb6; --c-training:#d9b352;
  --c-meds:#9db0c2; --c-note:#a3b3aa; --c-vet:#ef8a8a; --c-groom:#cba3e4; --c-weight:#9db0c2;
  --c-symptom:#e8926a; --c-mood:#6cc3d4;
  --c-bad:#f08b7f; --c-bad-soft:#3a1f1c; --c-good:#4fc39a;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{max-width:620px;margin:0 auto;padding:0 16px 104px;display:flex;flex-direction:column;gap:14px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px;padding:10px 16px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.pup{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.pup h1{margin:0;font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:-.015em;line-height:1.1}
.pup .age{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);
  border:1px solid transparent}
.iconbtn:hover{background:var(--surface);border-color:var(--line)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);padding:3px 9px 3px 3px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.who img{width:22px;height:22px;border-radius:50%;display:block}

/* since-strip */
.since{display:flex;gap:6px;overflow-x:auto;margin:10px -16px -2px;padding:0 16px 2px;scrollbar-width:none}
.since::-webkit-scrollbar{display:none}
.since-chip{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:6px 11px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);min-width:84px}
.since-chip .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.since-chip .v{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.since-chip.warn{border-color:var(--c-bad);background:var(--c-bad-soft)}
.since-chip.warn .v{color:var(--c-bad)}

/* ---------- running sessions ---------- */
.running{display:flex;flex-direction:column;gap:8px}
.run{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc,var(--accent));box-shadow:var(--shadow)}
.run .dot{width:8px;height:8px;border-radius:50%;background:var(--tc);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.run .lbl{font-weight:600;font-size:14px}
.run .el{font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;margin-left:auto;color:var(--tc)}
.run .stop{padding:7px 14px;border-radius:999px;background:var(--tc);color:var(--surface);font-weight:600;font-size:13px}
:root[data-theme="dark"] .run .stop,:root:not([data-theme="light"]) .run .stop{color:#0d1410}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .run .stop{color:#fff}}

/* ---------- tiles ---------- */
.sec-head{display:flex;align-items:center;gap:10px;margin:2px 0 -4px}
.sec-head h2{margin:0;font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.01em}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.sec-head .act{font-size:12px;color:var(--accent-ink);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:13px 4px 11px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.tile:active{transform:scale(.96)}
.tile .ic{width:26px;height:26px;color:var(--tc)}
.tile .nm{font-size:11.5px;font-weight:600;letter-spacing:.005em;color:var(--ink-2);text-align:center;line-height:1.15}
.tile[data-on="1"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--surface))}
.tile[data-on="1"] .nm{color:var(--tc)}

/* ---------- timeline ---------- */
.day{display:flex;flex-direction:column;gap:0}
.day-h{display:flex;align-items:baseline;gap:8px;padding:12px 2px 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);
  background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.day-h .d{font-family:var(--serif);font-size:14.5px;font-weight:700}
.day-h .s{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.ev{display:grid;grid-template-columns:52px 20px 1fr;gap:10px;align-items:flex-start;padding:7px 8px 7px 2px;
  border-radius:var(--r-s);text-align:left;width:100%}
.ev:hover{background:var(--surface)}
.ev .t{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.ev .rail{position:relative;display:grid;place-items:center;padding-top:2px;align-self:stretch}
.ev .rail::before{content:"";position:absolute;top:0;bottom:-14px;width:1px;background:var(--line)}
.ev:last-child .rail::before{display:none}
.ev .ic{position:relative;width:18px;height:18px;color:var(--tc);background:var(--bg);padding:1px 0}
.ev .body{min-width:0}
.ev .ttl{font-size:14px;font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.ev .meta{font-size:12.5px;color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere}
.ev .by{font-size:11px;color:var(--ink-3);margin-top:2px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:1.5px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.pill.bad{background:var(--c-bad-soft);color:var(--c-bad)}
.pill.dur{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);font-family:var(--mono);text-transform:none;letter-spacing:0}

/* ---------- cards / stats ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.stat{background:var(--surface);padding:11px 12px 12px}
.stat .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--sc,var(--ink))}
.stat .u{font-size:11px;color:var(--ink-3);font-family:var(--sans)}

.bars{display:flex;align-items:flex-end;gap:5px;height:88px;margin-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.bar{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--bc,var(--accent));min-height:2px}
.bar-col .lab{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.bar-col.today .lab{color:var(--ink);font-weight:500}
.bar-val{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:10px}
.heat i{display:block;height:24px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.heat-ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:4px}

/* 24-hour sleep band: one row per day, blocks placed by clock position */
.band-row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;margin-top:4px}
.band-row .dl{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right}
.band-row.today .dl{color:var(--ink);font-weight:500}
.band{position:relative;height:15px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.band i{position:absolute;top:0;bottom:0;background:var(--c-sleep)}
.band i.in-crate{background:var(--c-crate)}
.band .nowline{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink-3);opacity:.6}

/* ---------- pantry ---------- */
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .sw{width:4px;align-self:stretch;border-radius:3px;background:var(--tc);flex:0 0 4px}
.item .nm{font-weight:600;font-size:14.5px}
.item .br{font-size:12px;color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase;font-weight:600}
.item .no{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.item .rt{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.verdict{font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:999px;white-space:nowrap}
.v5{background:var(--accent-soft);color:var(--accent-ink)}
.v4{background:var(--surface-2);color:var(--c-good);border:1px solid var(--line)}
.v3{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.v2{background:var(--surface-2);color:var(--c-meal);border:1px solid var(--line)}
.v1{background:var(--c-bad-soft);color:var(--c-bad)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:30px 18px;color:var(--ink-3)}
.empty .hd{font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:5px}
.empty p{margin:0;font-size:13.5px;max-width:34ch;margin-inline:auto}

/* ---------- tabbar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;width:100%;max-width:620px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;color:var(--ink-3);font-size:10.5px;font-weight:600}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{color:var(--accent-ink)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,16,13,.45);display:grid;align-items:flex-end;justify-items:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-l) var(--r-l) 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(14px);opacity:.5}}
.sheet h3{margin:0 0 2px;font-family:var(--serif);font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.sheet h3 svg{width:20px;height:20px;color:var(--tc)}
.sheet .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 14px}
.field{margin-bottom:13px}
.field>label{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.inp{width:100%;padding:9px 11px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface-2);font-size:15px}
textarea.inp{min-height:62px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-2);
  font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:var(--surface);font-weight:600}
:root[data-theme="dark"] .chip[aria-pressed="true"],:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1410}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .chip[aria-pressed="true"]{color:#fff}}
.rowb{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:var(--r-m);font-weight:600;font-size:15px;text-align:center}
.btn.p{background:var(--accent);color:var(--accent-on)}
.btn.s{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn.d{background:transparent;border:1px solid var(--c-bad);color:var(--c-bad);flex:0 0 auto;padding-inline:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow);animation:up .18s ease}
.banner{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-m);
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.banner svg{width:16px;height:16px;flex:0 0 16px;color:var(--ink-3);margin-top:1px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- clicker ---------- */
.clicker-launch{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.clicker-launch .ring{width:30px;height:30px;border-radius:50%;border:2px solid var(--c-training);display:grid;place-items:center;flex:0 0 30px}
.clicker-launch .ring i{width:11px;height:11px;border-radius:50%;background:var(--c-training);display:block}
.clicker-launch .cl{font-weight:600;font-size:14px}
.clicker-launch .cs{font-size:12px;color:var(--ink-3)}
.clicker-launch .go{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-ink)}

.pad{position:relative;width:100%;aspect-ratio:1/1;max-width:250px;margin:6px auto 4px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--c-training) 26%,var(--surface)), var(--surface) 72%);
  border:2px solid var(--c-training);display:grid;place-items:center;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .06s ease}
.pad:active{transform:scale(.97)}
.pad.hit{animation:ping .3s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c-training) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.pad .n{font-family:var(--mono);font-size:52px;font-weight:500;line-height:1;color:var(--c-training);font-variant-numeric:tabular-nums}
.pad .w{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.clk-meta{display:flex;justify-content:center;gap:18px;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:12px;font-variant-numeric:tabular-nums}

/* ---------- puppy photo ---------- */
.pupshot{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 36px;
  border:2px solid var(--accent-soft);background:var(--surface-2)}
.shot-edit{position:relative;display:block;width:96px;height:96px;margin:0 auto 6px;border-radius:50%;
  overflow:hidden;border:2px solid var(--line-strong);background:var(--surface-2);cursor:pointer}
.shot-edit img{width:100%;height:100%;object-fit:cover;display:block}
.shot-edit .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:0 8px}
.shot-edit:hover .ph{color:var(--accent-ink)}

/* ---------- palettes ---------- */
/* Each palette restates only the accent family and the neutral's hue bias, so
   the event colours stay consistent from one palette to the next. */
:root[data-palette="clay"]{--accent:#b4562c;--accent-ink:#8d3f1d;--accent-soft:#f6e3d8;--accent-on:#fff;--bg:#f2efec;--surface-2:#faf6f3;--line:#e3dad3;--ink:#241a14;--ink-2:#5d4e45;--ink-3:#8a786d}
:root[data-palette="dusk"]{--accent:#5851c4;--accent-ink:#413b9e;--accent-soft:#e2e0f7;--accent-on:#fff;--bg:#eeeef4;--surface-2:#f7f7fb;--line:#dcdbe6;--ink:#1a1830;--ink-2:#4e4b67;--ink-3:#7d7a94}
:root[data-palette="berry"]{--accent:#b23a6d;--accent-ink:#8d2a54;--accent-soft:#f8e0eb;--accent-on:#fff;--bg:#f4eef1;--surface-2:#fbf6f8;--line:#e6d8de;--ink:#26161d;--ink-2:#5e4750;--ink-3:#8c7279}
:root[data-palette="slate"]{--accent:#2f6f8f;--accent-ink:#22556e;--accent-soft:#dce9f0;--accent-on:#fff;--bg:#eef1f3;--surface-2:#f7f9fa;--line:#dbe2e6;--ink:#161f24;--ink-2:#4b5a62;--ink-3:#7a8890}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-palette="clay"]{--accent:#e08a5c;--accent-ink:#f0ab84;--accent-soft:#3a251a;--accent-on:#1a0f08;--bg:#15110e;--surface:#1f1915;--surface-2:#271f1a;--line:#352b24;--ink:#f0e7e0;--ink-2:#b5a498;--ink-3:#8a786d}

  :root:not([data-theme="light"])[data-palette="berry"]{--accent:#ef85b3;--accent-ink:#f5a6c8;--accent-soft:#3d1b2c;--accent-on:#1a0810;--bg:#161013;--surface:#20181c;--surface-2:#282025;--line:#362a30;--ink:#f2e6ec;--ink-2:#bba3ad;--ink-3:#8c7279}

}

:root[data-theme="dark"][data-palette="dusk"]{--accent:#9b95ee;--accent-ink:#b8b3f5;--accent-soft:#252262;--accent-on:#0c0a1c;--bg:#111119;--surface:#1a1a26;--surface-2:#22222f;--line:#2f2f3e;--ink:#e8e7f2;--ink-2:#a9a7c0;--ink-3:#7d7a94}

.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw-btn{width:42px;height:42px;border-radius:12px;border:2px solid var(--line-strong);position:relative;
  display:grid;place-items:center}
.sw-btn[aria-pressed="true"]{border-color:var(--ink)}
.sw-btn i{width:20px;height:20px;border-radius:50%;display:block}
.invite{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r-m);
  background:var(--surface-2);border:1px dashed var(--line-strong)}
.invite code{font-family:var(--mono);font-size:17px;letter-spacing:.12em;font-weight:500;flex:1;
  overflow-wrap:anywhere}
.invite button{font-size:12px;font-weight:600;color:var(--accent-ink);white-space:nowrap}

/* ---------- sign-in / onboarding gate ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:28px 16px}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);padding:24px 20px;box-shadow:var(--shadow)}
.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.gate-brand .mk{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:0 0 34px}
.gate-brand .mk svg{width:20px;height:20px;color:var(--accent-on)}
.gate-brand b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.gate-h{margin:0 0 4px;font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em}
.gate-p{margin:0 0 18px;font-size:13.5px;color:var(--ink-2);max-width:42ch}
.gate-err{margin-top:10px;padding:9px 11px;border-radius:var(--r-s);background:var(--c-bad-soft);
  color:var(--c-bad);font-size:13px}
.gate-alt{display:block;width:100%;margin-top:14px;padding:8px;font-size:13px;color:var(--ink-2);text-decoration:underline}
.gate-or{text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 14px;position:relative}
.gate-or::before,.gate-or::after{content:"";position:absolute;top:50%;width:calc(50% - 22px);height:1px;background:var(--line)}
.gate-or::before{left:0}.gate-or::after{right:0}
#gate .field{margin-bottom:12px}
</style>

</head>

/* ============================ utils ============================ */
const $ = (s,r)=> (r||document).querySelector(s);
const pad = n => String(n).padStart(2,'0');
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function keyToDate(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtTime(iso){
  const d = new Date(iso); let h = d.getHours(); const ap = h<12?'am':'pm';
  h = h%12 || 12; return h+':'+pad(d.getMinutes())+ap;
}
function fmtDur(ms){
  if(ms==null || !isFinite(ms)) return '—';
  const m = Math.max(0, Math.round(ms/60000));
  if(m<60) return m+'m';
  const h = Math.floor(m/60); return h+'h '+pad(m%60)+'m';
}
function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return (h? h+':'+pad(m) : m)+':'+pad(sec);
}
function fmtAgo(ms){
  const m = Math.floor(ms/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h '+pad(m%60)+'m ago';
  return Math.floor(h/24)+'d ago';
}
function dayLabel(k){
  const today = dateKey(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  if(k===today) return 'Today';
  if(k===dateKey(y)) return 'Yesterday';
  return keyToDate(k).toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
}
function localInput(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==='text') n.textContent = v;
    else if(k==='html') n.innerHTML = v;
    else if(k==='style') n.setAttribute('style', v);
    else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true?'':v);
  }
  (kids||[]).forEach(c=>{ if(c) n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}

/* ============================ state ============================ */
const state = {
  profile: {name:'', birthday:'', unit:'lb', breed:'', size:'toy', photoUrl:'', theme:'moss'},
  invite: null,
  events: [],            // the source of truth, newest first-ish
  days: {},              // derived: date key -> {date, events:[]}
  pantry: {items:[]},
  members: {},           // user id -> display name
  session: null,
  householdId: null,
  dogId: null,
  me: null,
  canWrite: true,
  tab: 'log',
  storage: 'shared',
  ready: false
};

function allEvents(){
  const out = [];
  Object.keys(state.days).forEach(k => (state.days[k].events||[]).forEach(e => out.push(e)));
  out.sort((a,b)=> new Date(b.at) - new Date(a.at));
  return out;
}
function eventsOn(key){
  const d = state.days[key];
  return d && d.events ? d.events.slice().sort((a,b)=> new Date(b.at)-new Date(a.at)) : [];
}
function openSessions(){ return allEvents().filter(e => TYPES[e.type] && TYPES[e.type].mode==='timer' && !e.endAt); }
function lastOf(pred){ return allEvents().find(pred) || null; }

/* ============================ storage: supabase ============================ */
/* The rendering and analysis code above and below this block is unchanged from
   the original single-file version. It reads `state.days` — a map of date key to
   {date, events:[]} — so this layer's only job is to keep that map in sync with
   the `events` table and to push writes back. Each logged thing is its own row,
   so two people tapping at the same moment no longer overwrite each other. */

const SB = window.supabase.createClient(window.APP_CONFIG.supabaseUrl, window.APP_CONFIG.supabaseKey, {
  auth: {persistSession: true, autoRefreshToken: true},
  realtime: {params: {eventsPerSecond: 5}}
});

const LS = 'puppy-logbook-cache-v1';

/* Row <-> event. Everything type-specific rides in `data` so adding an event
   type never needs a migration. */
function rowToEvent(r){
  return Object.assign({}, r.data || {}, {
    id: r.id, type: r.type, at: r.at,
    endAt: r.ended_at || null, by: r.by_user || null
  });
}
function eventToRow(ev){
  const data = Object.assign({}, ev);
  delete data.id; delete data.type; delete data.at; delete data.endAt; delete data.by; delete data.createdAt;
  return {type: ev.type, at: ev.at, ended_at: ev.endAt || null, data};
}

/* state.days is derived, never edited directly. */
function rebuildDays(){
  const days = {};
  state.events.forEach(e=>{
    const k = dateKey(new Date(e.at));
    (days[k] = days[k] || {date:k, events:[]}).events.push(e);
  });
  state.days = days;
}
function putEvent(ev){
  const i = state.events.findIndex(e=>e.id===ev.id);
  if(i>-1) state.events[i] = ev; else state.events.push(ev);
  rebuildDays();
}
function dropEvent(id){
  state.events = state.events.filter(e=>e.id!==id);
  rebuildDays();
}

function saveLocal(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      profile: state.profile, events: state.events.slice(0, 1500),
      pantry: state.pantry, dogId: state.dogId, householdId: state.householdId
    }));
  }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS); if(!raw) return;
    const o = JSON.parse(raw);
    if(o.profile) state.profile = Object.assign(state.profile, o.profile);
    if(Array.isArray(o.events)) state.events = o.events;
    if(o.pantry) state.pantry = o.pantry;
    if(o.dogId) state.dogId = o.dogId;
    if(o.householdId) state.householdId = o.householdId;
    rebuildDays();
  }catch(e){}
}

function dbError(err, what){
  console.error(what, err);
  const msg = (err && err.message) || '';
  if(/row-level security|permission/i.test(msg)) toast("You are not a member of this household any more.");
  else if(/JWT|session/i.test(msg)) toast("Your session expired — sign in again.");
  else toast("Couldn't save. It is still on this device; it will retry when you are back online.");
}

/* ---- writes ---- */
async function addEvent(ev){
  if(!state.dogId){ toast('Add her details first.'); return null; }
  const optimistic = Object.assign({id:'tmp-'+uid(), at:new Date().toISOString(), by:state.me && state.me.id}, ev);
  putEvent(optimistic); render(); saveLocal();
  const row = Object.assign(eventToRow(optimistic), {dog_id: state.dogId, by_user: state.me && state.me.id});
  const {data, error} = await SB.from('events').insert(row).select().single();
  if(error){ dropEvent(optimistic.id); render(); dbError(error, 'addEvent'); return null; }
  dropEvent(optimistic.id); putEvent(rowToEvent(data)); render(); saveLocal();
  return rowToEvent(data);
}
function findEvent(id){
  const ev = state.events.find(e=>e.id===id);
  return ev ? {ev, key: dateKey(new Date(ev.at))} : null;
}
async function patchEvent(id, patch){
  const f = findEvent(id); if(!f) return;
  const before = f.ev;
  const merged = Object.assign({}, before, patch);
  putEvent(merged); render(); saveLocal();
  if(String(id).indexOf('tmp-')===0) return;
  const row = eventToRow(merged);
  const {error} = await SB.from('events').update(row).eq('id', id);
  if(error){ putEvent(before); render(); dbError(error, 'patchEvent'); }
}
async function removeEvent(id){
  const f = findEvent(id); if(!f) return;
  const before = f.ev;
  dropEvent(id); render(); saveLocal();
  if(String(id).indexOf('tmp-')===0) return;
  const {error} = await SB.from('events').delete().eq('id', id);
  if(error){ putEvent(before); render(); dbError(error, 'removeEvent'); }
}
async function writePantry(){
  saveLocal();
  // Pantry writes are handled per-item by openItemSheet through savePantryItem.
}
async function savePantryItem(item, isNew){
  const row = {dog_id: state.dogId, kind:item.kind, brand:item.brand, name:item.name,
    rating:item.rating, note:item.note};
  if(isNew){
    row.added_by = state.me && state.me.id;
    const {data, error} = await SB.from('pantry_items').insert(row).select().single();
    if(error) return dbError(error, 'pantry insert');
    item.id = data.id;
  } else {
    const {error} = await SB.from('pantry_items').update(row).eq('id', item.id);
    if(error) return dbError(error, 'pantry update');
  }
  saveLocal();
}
async function deletePantryItem(id){
  const {error} = await SB.from('pantry_items').delete().eq('id', id);
  if(error) dbError(error, 'pantry delete');
  saveLocal();
}
async function writeProfile(){
  saveLocal();
  if(!state.dogId) return;
  const p = state.profile;
  const {error} = await SB.from('dogs').update({
    name:p.name, birthday:p.birthday || null, breed:p.breed, size:p.size, unit:p.unit,
    photo_url:p.photoUrl || '', theme:p.theme || 'moss'
  }).eq('id', state.dogId);
  if(error) dbError(error, 'writeProfile');
}

/* ---- loading ---- */
async function loadAll(){
  const [evs, pantry, dogRes, members, hh] = await Promise.all([
    SB.from('events').select('*').eq('dog_id', state.dogId).order('at', {ascending:false}).limit(4000),
    SB.from('pantry_items').select('*').eq('dog_id', state.dogId),
    SB.from('dogs').select('*').eq('id', state.dogId).single(),
    SB.from('household_members').select('user_id, display_name').eq('household_id', state.householdId),
    SB.from('households').select('invite_code, name').eq('id', state.householdId).single()
  ]);
  if(evs.data) state.events = evs.data.map(rowToEvent);
  if(pantry.data) state.pantry = {items: pantry.data.map(r=>({
    id:r.id, kind:r.kind, brand:r.brand, name:r.name, rating:r.rating, note:r.note
  }))};
  if(dogRes.data){
    const d = dogRes.data;
    state.profile = {name:d.name||'', birthday:d.birthday||'', breed:d.breed||'', size:d.size||'toy', unit:d.unit||'lb', photoUrl:d.photo_url||'', theme:d.theme||'moss'};
    applyPalette(state.profile.theme);
  }
  if(hh.data){ state.invite = hh.data.invite_code; state.householdName = hh.data.name; }
  state.members = {};
  (members.data||[]).forEach(m=>{ state.members[m.user_id] = m.display_name || ''; });
  rebuildDays(); state.ready = true; saveLocal(); render();
}

let channel = null;
function subscribe(){
  if(channel) SB.removeChannel(channel);
  channel = SB.channel('log-'+state.dogId)
    .on('postgres_changes', {event:'*', schema:'public', table:'events', filter:'dog_id=eq.'+state.dogId}, payload=>{
      if(payload.eventType === 'DELETE'){ dropEvent(payload.old.id); }
      else { putEvent(rowToEvent(payload.new)); }
      saveLocal(); render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'pantry_items', filter:'dog_id=eq.'+state.dogId}, ()=>{
      SB.from('pantry_items').select('*').eq('dog_id', state.dogId).then(({data})=>{
        if(data) state.pantry = {items:data.map(r=>({id:r.id,kind:r.kind,brand:r.brand,name:r.name,rating:r.rating,note:r.note}))};
        saveLocal(); render();
      });
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'dogs', filter:'id=eq.'+state.dogId}, payload=>{
      const d = payload.new;
      state.profile = {name:d.name||'', birthday:d.birthday||'', breed:d.breed||'', size:d.size||'toy', unit:d.unit||'lb', photoUrl:d.photo_url||'', theme:d.theme||'moss'};
      applyPalette(state.profile.theme);
      saveLocal(); render();
    })
    .subscribe();
}

function authScreen(mode){
  const wrap = el('div',{});
  wrap.appendChild(el('h2',{class:'gate-h', text: mode==='up' ? 'Create your account' : 'Welcome back'}));
  wrap.appendChild(el('p',{class:'gate-p', text: mode==='up'
    ? 'One account each. Everyone in the household logs to the same record.'
    : 'Sign in to pick up the log where the rest of the house left off.'}));

  const email = el('input',{class:'inp', id:'authEmail', type:'email', autocomplete:'email', placeholder:'you@example.com'});
  const pass  = el('input',{class:'inp', id:'authPass', type:'password',
    autocomplete: mode==='up' ? 'new-password' : 'current-password', placeholder:'At least 8 characters'});
  const name  = el('input',{class:'inp', id:'authName', autocomplete:'name', placeholder:'The name the others will see'});

  wrap.appendChild(field('Email', email));
  if(mode==='up') wrap.appendChild(field('Your name', name));
  wrap.appendChild(field('Password', pass));

  const err = el('div',{class:'gate-err', hidden:true});

    text: mode==='up' ? 'Create account' : 'Sign in', onclick: async ()=>{
    err.hidden = true;
    const e = email.value.trim(), p = pass.value;
    if(!e || !p) return fail('Email and password, please.');
    go.disabled = true; go.textContent = 'One moment…';

      ? await SB.auth.signUp({email:e, password:p, options:{data:{display_name:name.value.trim()}}})

    onclick:()=> showGate(authScreen(mode==='up' ? 'in' : 'up'))}));

/* ============================ profile helpers ============================ */
function ageWeeks(){
  if(!state.profile.birthday) return null;
  const b = keyToDate(state.profile.birthday);
  return Math.max(0, Math.floor((Date.now()-b.getTime())/(7*864e5)));
}
function ageText(){
  const w = ageWeeks(); if(w===null) return '';
  if(w < 16) return w+' weeks old';
  const months = Math.floor(w/4.345);
  if(months < 24) return months+' months old';
  return (months/12).toFixed(1)+' years old';
}
function ageMonths(){ const w = ageWeeks(); return w===null? null : w/4.345; }
function sizeSpec(){ return SIZE[state.profile.size] || SIZE.toy; }

/* Rough bladder-hold window while awake: the usual "one hour per month of age",
   scaled down for toy breeds and capped. A guide for setting a timer, nothing more. */
function holdHours(){
  const m = ageMonths(); if(m===null) return null;
  const s = sizeSpec();
  return Math.min(s.cap, Math.max(1, Math.round(m * s.bladder)));
}
/* Standard puppy exercise guide: five minutes per month of age, twice a day. */
function walkTarget(){ const m = ageMonths(); return m===null? null : Math.round(m*5); }
/* Meals per day taper: 4 until 12 weeks, 3 until 6 months, then 2. */
function mealTarget(){ const w = ageWeeks(); if(w===null) return null; return w<12? 4 : w<26? 3 : 2; }
/* Daytime crate ceiling for this age, in hours. */
function crateCeiling(){ const h = holdHours(); return h===null? null : Math.min(5, h+1); }

/* Sleep a puppy this age needs, in hours per 24. */
function sleepTarget(){
  const m = ageMonths();
  if(m===null) return 18;
  return m < 6 ? 18 : m < 12 ? 16 : 14;
}
/* How long she can reasonably stay awake between naps, in minutes. Under six
   months an hour to ninety minutes is the usual ceiling before she tips over. */
function awakeCeiling(){
  const m = ageMonths();
  if(m===null) return 120;
  return m < 4 ? 60 : m < 6 ? 90 : m < 9 ? 150 : 210;
}

/* Every sleep stretch, as absolute {start,end} ms. A running nap ends "now".
   Crate sessions count only when someone said she actually slept in there. */
function sleepSessions(){
  const out = [];
  allEvents().forEach(e=>{
    let crate = false;
    if(e.type==='sleep'){ crate = e.where==='crate'; }
    else if(e.type==='crate' && (e.sleptIn==='slept' || e.sleptIn==='dozed')){ crate = true; }
    else return;
    const start = new Date(e.at).getTime();
    const end = e.endAt ? new Date(e.endAt).getTime() : Date.now();
    if(end > start) out.push({start, end, crate, ev:e});
  });
  return out.sort((a,b)=>a.start-b.start);
}
/* Those stretches clipped to one calendar day and merged, so an overnight
   nap is counted against both days it actually covers. */
function sleepSpansOn(key){
  const dayStart = keyToDate(key).getTime(), dayEnd = dayStart + 864e5;
  const clipped = sleepSessions()
    .map(s => ({start: Math.max(s.start, dayStart), end: Math.min(s.end, dayEnd), crate: s.crate}))
    .filter(s => s.end > s.start)
    .sort((a,b)=>a.start-b.start);
  const merged = [];
  clipped.forEach(s=>{
    const prev = merged[merged.length-1];
    if(prev && s.start <= prev.end){ prev.end = Math.max(prev.end, s.end); prev.crate = prev.crate || s.crate; }
    else merged.push(Object.assign({}, s));
  });
  return merged;
}
function sleepMinutesOn(key){
  return sleepSpansOn(key).reduce((t,s)=> t + (s.end-s.start)/60000, 0);
}
/* Gaps between naps today, up to right now. */
function awakeStretches(key){
  const dayStart = keyToDate(key).getTime();
  const end = Math.min(dayStart + 864e5, Date.now());
  const spans = sleepSpansOn(key);
  const gaps = [];
  let cursor = dayStart;
  spans.forEach(s=>{ if(s.start > cursor) gaps.push({start:cursor, end:s.start}); cursor = Math.max(cursor, s.end); });
  if(cursor < end) gaps.push({start:cursor, end});
  return gaps.filter(g=> g.end - g.start > 0);
}
function awakeSince(){
  const sessions = sleepSessions().filter(s=> s.end <= Date.now());
  if(!sessions.length) return null;
  const nappingNow = sleepSessions().some(s=> s.end >= Date.now()-1000 && !s.ev.endAt);
  if(nappingNow) return null;
  return Math.max.apply(null, sessions.map(s=>s.end));
}

function breedNotes(){
  const b = (state.profile.breed||'').toLowerCase();
  const m = ageMonths();
  const out = [];
  if(m!==null && m<7 && (state.profile.size==='toy' || state.profile.size==='small')){
    out.push(['Small bladder, slower house-training',
      'Toy and small breeds are genuinely harder to house-train than the books admit — less bladder, more floor to find. Take her out on a timer rather than waiting for a signal, and treat every clean day as the win.']);
  }
  if(b.indexOf('york')>-1 && m!==null && m<6){
    out.push(['Keep meals close together',
      'Young Yorkshire-type puppies can drop their blood sugar if meals stretch too far apart. Aim for '+(mealTarget()||3)+' meals a day and no more than about five waking hours between them. Wobbliness or unusual lethargy after a long gap is worth a call to the vet.']);
  }
  if(b.indexOf('shih')>-1){
    out.push(['A short muzzle cools badly',
      'Shih Tzus are brachycephalic — they shed heat through panting less efficiently than a longer-nosed dog. Keep sessions to about '+(walkTarget()||20)+' minutes, go early or late in warm weather, and stop at noisy or laboured breathing.']);
  }
  if(b.indexOf('shih')>-1){
    out.push(['Watch the eyes and the skin',
      'Big, forward-set eyes sit close to whatever she sticks her face into, so squinting, pawing at an eye or a sudden discharge is a same-day vet call rather than a wait-and-see. The breed also runs itchy — log scratching under Symptom and the pattern will be there when you need it.']);
  }
  if(b.indexOf('york')>-1){
    out.push(['A harness, not a collar',
      'Yorkshire Terriers are prone to a weak windpipe, and lead pressure on the throat is the thing that aggravates it. Walk her on a harness, and treat a honking, goose-like cough as something to get looked at.']);
  }
  if(m!==null && m<7){
    out.push(['Teething runs to about six months',
      'Puppy teeth give way to adult teeth from roughly three to six months, and the chewing peaks in the middle of that. Frozen chews do more than hard ones — cold is what actually helps a sore mouth. Check the Teething card for which ones hold her.']);
  }
  if(b.indexOf('shih')>-1 || b.indexOf('york')>-1){
    out.push(['A coat that never stops growing',
      'Both of those breeds carry hair rather than fur, so it keeps growing and mats instead of shedding out. Short daily brushing now is really handling practice — it buys you a dog who tolerates a groomer later. Log it under Grooming so you can see the habit hold.']);
  }
  if(m!==null && m<6){
    out.push(['She still needs to sleep most of the day',
      'Puppies this age run on 18 to 20 hours of sleep. Overtiredness looks exactly like bad behaviour — biting, zoomies, refusing to settle in the crate. If a crate session goes badly, check the nap log before you blame the crate.']);
  }
  return out;
}

/* Potty prediction: last break plus the hold window, but the clock effectively
   pauses while she is asleep or crated. */
function pottyDue(){
  const h = holdHours(); if(h===null) return null;
  const last = lastOf(e=>e.type==='potty');
  if(!last) return null;
  const from = new Date(last.endAt || last.at).getTime();
  const resting = openSessions().some(e=> e.type==='sleep' || e.type==='crate');
  return {due: from + h*3600e3, from, resting};
}

function renderSince(){
  const box = $('#since'); box.innerHTML='';
  const hold = holdHours();

  const due = pottyDue();
  if(due){
    const left = due.due - Date.now();
    const chip = el('div',{class:'since-chip'+(left<0 && !due.resting ?' warn':'')},[
      el('span',{class:'k', text: due.resting? 'Out when she wakes' : (left<0? 'Overdue out' : 'Due out in')}),
      el('span',{class:'v','data-due':due.due, text: due.resting? '—' : fmtDur(Math.abs(left))})
    ]);
    box.appendChild(chip);
  }

  const wake = awakeSince();
  if(wake){
    const up = Date.now() - wake;
    box.appendChild(el('div',{class:'since-chip'+(up > awakeCeiling()*60000 ? ' warn':'')},[
      el('span',{class:'k', text:'Awake for'}),
      el('span',{class:'v','data-ago-raw':wake, text:fmtDur(up)})
    ]));
  }

  const specs = [
    ['Last potty', lastOf(e=>e.type==='potty'), hold ? hold*3600e3 : null],
    ['Last meal',  lastOf(e=>e.type==='meal'), null],
    ['Last walk',  lastOf(e=>e.type==='walk'), null],
    ['Last crate', lastOf(e=>e.type==='crate'), null]
  ];
  let any = false;
  specs.forEach(([label, ev, warnAfter])=>{
    if(!ev) return; any = true;
    const t = ev.endAt || ev.at;
    const age = Date.now() - new Date(t).getTime();
    const warn = warnAfter && age > warnAfter;
    const chip = el('div',{class:'since-chip'+(warn?' warn':'')},[
      el('span',{class:'k', text:label}),
      el('span',{class:'v', 'data-ago':t, text:fmtAgo(age)})
    ]);
    box.appendChild(chip);
  });
  if(!any && hold){
    box.appendChild(el('div',{class:'since-chip'},[
      el('span',{class:'k',text:'Bladder rule'}),
      el('span',{class:'v',text:'~'+hold+'h'})
    ]));
  }
  box.hidden = box.children.length===0;
}

    ]));

function daySummary(evs){
  const n = t => evs.filter(e=>e.type===t).length;
  const bits = [];
  if(n('meal')) bits.push(n('meal')+' meals');
  if(n('potty')) bits.push(n('potty')+' potty');
  const acc = evs.filter(e=>e.type==='potty'&&e.where==='accident').length;
  if(acc) bits.push(acc+' accident'+(acc>1?'s':''));
  const walkMin = evs.filter(e=>e.type==='walk'&&e.endAt).reduce((s,e)=>s+(new Date(e.endAt)-new Date(e.at)),0);
  if(walkMin) bits.push(Math.round(walkMin/60000)+'m walked');
  return bits.join(' · ');
}
function eventRow(e){
  const T = TYPES[e.type] || TYPES.note;
  const row = el('button',{class:'ev', style:'--tc:'+T.color, onclick:()=>openEventSheet(e)});
  const rail = el('span',{class:'rail'});
  rail.innerHTML = svg(T.icon,'ic');
  const ttl = el('span',{class:'ttl'});
  ttl.appendChild(el('span',{text: eventTitle(e)}));
  if(e.type==='potty' && e.where==='accident') ttl.appendChild(el('span',{class:'pill bad', text:'accident'}));
  if(T.mode==='timer'){
    if(e.endAt) ttl.appendChild(el('span',{class:'pill dur', text: fmtDur(new Date(e.endAt)-new Date(e.at))}));
    else ttl.appendChild(el('span',{class:'pill', text:'running'}));
  }
  if(e.type==='training' && e.score) ttl.appendChild(el('span',{class:'pill dur', text:'★ '+e.score+'/5'}));
  const body = el('span',{class:'body'},[ttl]);
  const meta = eventMeta(e);
  if(meta) body.appendChild(el('span',{class:'meta', text:meta}));
  if(e.by) body.appendChild(el('span',{class:'by', 'data-uid':e.by, text:'…'}));
  row.appendChild(el('span',{class:'t', text:fmtTime(e.at)}));
  row.appendChild(rail);
  row.appendChild(body);
  return row;
}
function eventTitle(e){
  const T = TYPES[e.type] || TYPES.note;
  if(e.type==='meal') return e.meal || 'Meal';
  if(e.type==='potty'){
    const m = {pee:'Pee', poop:'Poop', both:'Pee + poop'};
    return m[e.kind] || 'Potty';
  }
  if(e.type==='training') return e.cue ? 'Training · '+e.cue : 'Training';
  if(e.type==='weight') return e.weight ? 'Weighed '+e.weight+' '+(state.profile.unit||'lb') : 'Weigh-in';
  if(e.type==='health'){
    const s = e.symptoms||[];
    if(!s.length) return 'Symptom';
    const first = (SYMPTOMS.find(x=>x[0]===s[0])||[,'Symptom'])[1];
    return s.length>1 ? first+' +'+(s.length-1) : first;
  }
  if(e.type==='mood') return (ENERGY.find(x=>x[0]===e.energy)||[,'How she seems'])[1];
  if(e.type==='chew') return (CHEW_KINDS.find(x=>x[0]===e.chewKind)||[,'Chew'])[1];
  return T.label;
}
function eventMeta(e){
  const bits = [];
  const item = e.itemId && state.pantry.items.find(i=>i.id===e.itemId);
  if(item) bits.push(item.brand ? item.brand+' · '+item.name : item.name);
  if(e.type==='meal'){
    if(e.amount) bits.push(e.amount);
    if(e.ate) bits.push({all:'ate it all', most:'ate most', half:'ate about half', little:'barely touched it', none:'refused it'}[e.ate]);
  }
  if(e.type==='potty'){
    if(e.where && e.where!=='accident') bits.push({outside:'outside', pad:'on the pad'}[e.where] || e.where);
    if(e.quality && e.quality!=='normal') bits.push('stool: '+e.quality);
  }
  if(e.type==='treat' && e.reaction) bits.push({loved:'loved it', liked:'liked it', meh:'took it or left it', no:'spat it out'}[e.reaction]);
  if(e.type==='training'){
    if(e.minutes) bits.push(e.minutes+' min');
    if(e.clicks) bits.push(e.clicks+' marks');
    if(e.lesson) bits.push(e.lesson);
  }
  if(e.type==='crate'){
    if(e.alone) bits.push({alone:'alone in the house', home:'someone home', room:'someone in the room'}[e.alone]);
    if(e.outcome){ const o = CRATE_OUTCOMES.find(x=>x[0]===e.outcome); if(o) bits.push(o[1].toLowerCase()); }
    if(e.settleMin!=null) bits.push('settled in '+e.settleMin+'m');
    if(e.sleptIn && e.sleptIn!=='no') bits.push(e.sleptIn==='slept'? 'slept in there' : 'dozed');
  }
  if(e.type==='sleep'){
    if(e.where){ const w = NAP_WHERE.find(x=>x[0]===e.where); if(w) bits.push(w[1].toLowerCase()); }
    if(e.settled){ const s = NAP_SETTLED.find(x=>x[0]===e.settled); if(s) bits.push(s[1].toLowerCase()); }
  }
  if(e.type==='health'){
    if(e.severity && e.severity!=='mild') bits.push({noticeable:'noticeable', bad:'bad'}[e.severity]);
    if(e.areas && e.areas.length) bits.push(e.areas.map(a=>(BODY_AREAS.find(x=>x[0]===a)||[,a])[1].toLowerCase()).join(', '));
    const extra = (e.symptoms||[]).slice(1).map(s=>(SYMPTOMS.find(x=>x[0]===s)||[,s])[1].toLowerCase());
    if(extra.length) bits.push(extra.join(', '));
  }
  if(e.type==='mood' && e.tags && e.tags.length) bits.push(e.tags.join(', '));
  if(e.type==='chew'){
    if(e.minutes) bits.push(e.minutes+' min');
    if(e.effect){ const f = CHEW_EFFECT.find(x=>x[0]===e.effect); if(f) bits.push(f[1].toLowerCase()); }
    if(e.teething && e.teething.length) bits.push(e.teething.join(', '));
  }
  if(e.type==='walk' && e.where) bits.push(e.where);
  if(e.type==='water' && e.amount) bits.push(e.amount);
  if(e.type==='meds' && e.what) bits.push(e.what);
  if(e.note) bits.push(e.note);
  return bits.join(' · ');
}
function resolveNames(){
  document.querySelectorAll('[data-uid]').forEach(n=>{
    const id = n.getAttribute('data-uid');
    if(state.me && id === state.me.id){ n.textContent = 'logged by you'; return; }
    n.textContent = 'logged by ' + (state.members[id] || 'someone in the house');
  });
}

function focusPotty(){
  const c = el('div',{class:'card', style:'--tc:var(--c-potty)'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 10px'},[
    el('h2',{text:'Potty training'}), el('span',{class:'rule'})
  ]));

  const due = pottyDue();
  const hold = holdHours();
  if(due){
    const left = due.due - Date.now();
    const over = left < 0 && !due.resting;
    c.appendChild(el('div',{style:'display:flex;align-items:baseline;gap:10px;margin-bottom:12px'},[
      el('span',{style:'font-family:var(--mono);font-size:34px;font-weight:500;line-height:1;color:'+(over?'var(--c-bad)':'var(--c-potty)'),
        'data-due':due.due, text: due.resting? '—' : fmtDur(Math.abs(left))}),
      el('span',{style:'font-size:13px;color:var(--ink-2);max-width:26ch',
        text: due.resting ? 'She is resting — the clock restarts when she is up. Take her straight out.'
             : over ? 'past her usual window. Take her out now.'
             : 'until the end of her usual '+hold+'-hour window.'})
    ]));
  } else {
    c.appendChild(el('div',{class:'hint', style:'margin-bottom:10px', text:'Log one potty break and the countdown starts.'}));
  }

  // success rate, 7 days
  const cut = Date.now() - 7*864e5;
  const p = allEvents().filter(e=>e.type==='potty' && new Date(e.at).getTime()>cut);
  const acc = p.filter(e=>e.where==='accident').length;
  const rate = p.length? Math.round(100*(p.length-acc)/p.length) : null;
  const streak = accidentFreeStreak();
  const stats = el('div',{class:'stats', style:'margin-bottom:12px'});
  const addStat = (k,v,color)=> stats.appendChild(el('div',{class:'stat', style:color?'--sc:'+color:null},[el('div',{class:'k',text:k}),el('div',{class:'v',text:v})]));
  addStat('Made it outside', rate===null? '—' : rate+'%', rate===null? null : rate>=90?'var(--c-good)': rate>=75?'var(--c-meal)':'var(--c-bad)');
  addStat('Accidents · 7d', String(acc), acc? 'var(--c-bad)':'var(--c-good)');
  addStat('Clean-day streak', streak===null? '—' : String(streak), streak? 'var(--c-good)':null);
  c.appendChild(stats);

  // accident triggers
  const trig = {};
  allEvents().filter(e=>e.type==='potty'&&e.where==='accident'&&e.trigger).forEach(e=>{ trig[e.trigger]=(trig[e.trigger]||0)+1; });
  const tk = Object.keys(trig).sort((a,b)=>trig[b]-trig[a]);
  if(tk.length){
    c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px', text:'Where the accidents come from'}));
    const maxT = trig[tk[0]];
    tk.slice(0,5).forEach(k=>{
      const lab = (ACCIDENT_TRIGGERS.find(x=>x[0]===k)||[k,k])[1];
      c.appendChild(el('div',{style:'display:flex;align-items:center;gap:9px;padding:4px 0'},[
        el('span',{style:'font-size:13px;flex:0 0 46%', text:lab}),
        el('span',{style:'flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden'},[
          el('span',{style:'display:block;height:100%;width:'+Math.round(100*trig[k]/maxT)+'%;background:var(--c-bad);border-radius:4px'})
        ]),
        el('span',{class:'count', text:String(trig[k])})
      ]));
    });
    const top = (ACCIDENT_TRIGGERS.find(x=>x[0]===tk[0])||[])[1];
    c.appendChild(el('div',{class:'hint', style:'margin-top:8px', text:'"'+top+'" is her most common one. That is the moment to add a scheduled trip outside rather than a correction.'}));
  }

  // her own pattern
  const hours = {};
  allEvents().filter(e=>e.type==='potty' && e.where!=='accident' && new Date(e.at).getTime() > Date.now()-14*864e5)
    .forEach(e=>{ const h = new Date(e.at).getHours(); hours[h]=(hours[h]||0)+1; });
  const hk = Object.keys(hours).map(Number).sort((a,b)=>hours[b]-hours[a]).slice(0,7).sort((a,b)=>a-b);
  if(hk.length>=3){
    c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:12px 0 6px', text:'Her own schedule so far'}));
    const row = el('div',{class:'chips'});
    hk.forEach(h=> row.appendChild(el('span',{class:'chip', style:'cursor:default', text:((h%12)||12)+(h<12?'am':'pm')})));
    c.appendChild(row);
    c.appendChild(el('div',{class:'hint', style:'margin-top:7px', text:'Built from the last two weeks of successful breaks. Setting phone alarms just before these is usually faster than waiting for her to ask.'}));
  }
  return c;
}

function focusCrate(){
  const c = el('div',{class:'card', style:'--tc:var(--c-crate)'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 10px'},[
    el('h2',{text:'Crate & alone time'}), el('span',{class:'rule'})
  ]));

  const sessions = allEvents().filter(e=>e.type==='crate' && e.endAt);
  const mins = e => (new Date(e.endAt)-new Date(e.at))/60000;
  const aloneOk = sessions.filter(e=> e.alone==='alone' && OUTCOME_OK[e.outcome]);
  const best = aloneOk.length? Math.round(Math.max.apply(null, aloneOk.map(mins))) : 0;
  const nextStep = CRATE_LADDER.find(v=> v > best) || CRATE_LADDER[CRATE_LADDER.length-1];
  const ceiling = crateCeiling();

  c.appendChild(el('div',{style:'display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px'},[
    el('div',{},[
      el('div',{class:'k', style:'font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)', text:'Longest calm stretch alone'}),
      el('div',{style:'font-family:var(--mono);font-size:34px;font-weight:500;line-height:1.1;color:var(--c-crate)', text: best? fmtDur(best*60000) : '—'})
    ]),
    el('div',{style:'flex:1;min-width:170px;padding-bottom:3px'},[
      el('div',{style:'font-size:13.5px;color:var(--ink-2)', text: best
        ? 'Next rung on the ladder: '+fmtDur(nextStep*60000)+' alone with the door closed. Hold a rung until she settles in under two minutes twice in a row before you move up.'
        : 'Log a crate session with "Nobody — she was alone" and how it went, and the ladder starts building itself.'})
    ])
  ]));

  // ladder
  const lad = el('div',{class:'chips', style:'margin-bottom:12px'});
  CRATE_LADDER.forEach(v=>{
    const done = v <= best;
    const isNext = v === nextStep;
    lad.appendChild(el('span',{class:'chip', style:'cursor:default;font-family:var(--mono);font-size:12px;'+
      (done? 'background:var(--c-crate);border-color:var(--c-crate);color:var(--surface)' :
       isNext? 'border-color:var(--c-crate);color:var(--c-crate);font-weight:700' : 'opacity:.55'),
      text: v<60? v+'m' : (v/60)+'h'}));
  });
  c.appendChild(lad);

  if(!sessions.length){
    c.appendChild(el('div',{class:'hint', text:'Tap Crate on the Log tab when she goes in, End when she comes out. The sheet then asks the two things that matter: whether she was actually alone, and how long she took to settle.'}));
    return c;
  }

  // settle-time trend
  const withSettle = sessions.filter(e=> e.settleMin!=null).slice(0,10).reverse();
  if(withSettle.length>1){
    const max = Math.max.apply(null, withSettle.map(e=>e.settleMin).concat([1]));
    c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600', text:'Minutes to settle — last '+withSettle.length+' sessions'}));
    const bars = el('div',{class:'bars', style:'height:70px'});
    withSettle.forEach(e=>{
      const h = e.settleMin? Math.max(4, Math.round(64*(e.settleMin/max))) : 2;
      bars.appendChild(el('div',{class:'bar-col'},[
        el('span',{class:'bar-val', text:String(e.settleMin)}),
        el('div',{class:'bar', style:'--bc:'+(OUTCOME_OK[e.outcome]?'var(--c-crate)':'var(--c-bad)')+';height:'+h+'px'}),
        el('span',{class:'lab', text:fmtDur(mins(e)*60000).replace(' ','')})
      ]));
    });
    c.appendChild(bars);
    const first = withSettle[0].settleMin, last = withSettle[withSettle.length-1].settleMin;
    c.appendChild(el('div',{class:'hint', text: last < first
      ? 'Trending down — she is settling faster than she was. Bar labels are the length of each session.'
      : last > first ? 'Settle time is creeping up. That usually means the jump was too big, or she went in overtired — check the nap log.'
      : 'Holding steady. Bar labels are the length of each session; red bars are sessions that went badly.'}));
  }

  // outcome mix
  const cut = Date.now()-14*864e5;
  const recent = sessions.filter(e=> new Date(e.at).getTime()>cut && e.outcome);
  if(recent.length){
    const counts = {};
    recent.forEach(e=> counts[e.outcome]=(counts[e.outcome]||0)+1);
    c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:12px 0 6px', text:'How the last two weeks went'}));
    const bar = el('div',{style:'display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)'});
    const colors = {settled:'var(--c-good)', fussed:'var(--c-crate)', whined:'var(--c-meal)', panicked:'var(--c-bad)', soiled:'var(--c-bad)'};
    CRATE_OUTCOMES.forEach(([k])=>{ if(counts[k]) bar.appendChild(el('span',{style:'width:'+(100*counts[k]/recent.length)+'%;background:'+colors[k]})); });
    c.appendChild(bar);
    const legend = el('div',{style:'display:flex;flex-wrap:wrap;gap:10px;margin-top:7px'});
    CRATE_OUTCOMES.forEach(([k,label])=>{ if(!counts[k]) return;
      legend.appendChild(el('span',{style:'display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)'},[
        el('span',{style:'width:8px;height:8px;border-radius:2px;background:'+colors[k]}), el('span',{text:label+' · '+counts[k]})
      ]));
    });
    c.appendChild(legend);
    const bad = (counts.panicked||0)+(counts.soiled||0);
    if(counts.soiled) c.appendChild(el('div',{class:'hint', text:'She has soiled the crate. That is usually the crate being too big — she can use one end and sleep in the other — or the stretch being longer than her bladder. Shorten it and block off the spare space before anything else.'}));
    else if(bad) c.appendChild(el('div',{class:'hint', text:'A few sessions went badly. Drop back a rung on the ladder for a week rather than pushing through — panic in the crate is the one thing that sets this back hardest.'}));
  }

  const longest = sessions.filter(e=> new Date(e.at).getTime()>Date.now()-864e5);
  const longestToday = longest.length? Math.round(Math.max.apply(null, longest.map(mins))) : 0;
  if(ceiling && longestToday > ceiling*60){
    c.appendChild(el('div',{class:'banner', style:'margin-top:12px', html: svg('info') +
      '<span>A stretch today ran to '+fmtDur(longestToday*60000)+'. At her age, daytime crate stretches are usually kept under about '+ceiling+' hours — overnight is different, since she is asleep.</span>'}));
  }
  return c;
}

function focusSleep(){
  const c = el('div',{class:'card', style:'--tc:var(--c-sleep)'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 10px'},[
    el('h2',{text:'Sleep & naps'}), el('span',{class:'rule'}),
    el('button',{class:'act', text:'Start a nap', onclick:()=>startType('sleep')})
  ]));

  const today = dateKey(new Date());
  const sessions = sleepSessions();
  if(!sessions.length){
    c.appendChild(el('div',{style:'font-size:13.5px;color:var(--ink-2);max-width:60ch;margin-bottom:10px',
      text:'A four-month-old needs around '+sleepTarget()+' hours of sleep in every 24 — most of it in naps. Overtiredness looks exactly like bad behaviour: nipping, zoomies, and a puppy who will not settle in the crate.'}));
    c.appendChild(el('div',{class:'hint', text:'Tap Nap when she goes down and End when she wakes, or record an overnight crate stretch with "Slept in there". This card then shows her daily total, how long she is staying awake between naps, and where she actually sleeps.'}));
    return c;
  }

  const mins = sleepMinutesOn(today);
  const target = sleepTarget()*60;
  const pct = Math.min(100, Math.round(100*mins/target));
  const short = mins < target*0.8;

  c.appendChild(el('div',{style:'display:flex;align-items:baseline;gap:10px;margin-bottom:8px'},[
    el('span',{style:'font-family:var(--mono);font-size:34px;font-weight:500;line-height:1;color:'+(short?'var(--c-meal)':'var(--c-sleep)'), text:fmtDur(mins*60000)}),
    el('span',{style:'font-size:13px;color:var(--ink-2);max-width:26ch', text:'slept today, against a rough target of '+sleepTarget()+' hours.'})
  ]));
  c.appendChild(el('div',{style:'height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-bottom:4px'},[
    el('div',{style:'height:100%;border-radius:4px;width:'+pct+'%;background:'+(short?'var(--c-meal)':'var(--c-sleep)')})
  ]));
  c.appendChild(el('div',{class:'hint', style:'margin-bottom:12px', text: short
    ? 'Running short. A puppy who is behind on sleep gets harder to crate, not easier — the fix is usually an earlier nap, not a longer walk.'
    : 'On track. Overnight counts too, as long as the crate stretch is logged with "Slept in there".'}));

  // awake windows today
  const gaps = awakeStretches(today);
  const ceiling = awakeCeiling();
  const longest = gaps.length? Math.max.apply(null, gaps.map(g=>(g.end-g.start)/60000)) : 0;
  const naps = sleepSpansOn(today).length;
  const stats = el('div',{class:'stats', style:'margin-bottom:12px'});
  const addStat = (k,v,color)=> stats.appendChild(el('div',{class:'stat', style:color?'--sc:'+color:null},[el('div',{class:'k',text:k}),el('div',{class:'v',text:v})]));
  addStat('Naps today', String(naps));
  addStat('Longest awake', longest? fmtDur(longest*60000) : '—', longest > ceiling ? 'var(--c-bad)' : 'var(--c-good)');
  addStat('Awake ceiling', fmtDur(ceiling*60000));
  c.appendChild(stats);
  if(longest > ceiling){
    c.appendChild(el('div',{class:'banner', style:'margin-bottom:12px', html: svg('info') +
      '<span>She was up for '+fmtDur(longest*60000)+' at a stretch today. At '+Math.round(ageMonths())+' months the usual ceiling is about '+fmtDur(ceiling*60000)+
      ' before she tips into overtired — that is the window where the biting and the crate screaming start.</span>'}));
  }

  // 7-day nap map
  c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600', text:'When she sleeps'}));
  const days = last7();
  days.forEach(k=>{
    const spans = sleepSpansOn(k);
    const dayStart = keyToDate(k).getTime();
    const band = el('div',{class:'band'});
    spans.forEach(s=>{
      const left = 100*(s.start-dayStart)/864e5;
      const w = 100*(s.end-s.start)/864e5;
      band.appendChild(el('i',{class: s.crate? 'in-crate':null, style:'left:'+left+'%;width:'+w+'%',
        title: fmtTime(new Date(s.start).toISOString())+' – '+fmtTime(new Date(s.end).toISOString())}));
    });
    if(k===today){
      const nowPct = 100*(Date.now()-dayStart)/864e5;
      band.appendChild(el('div',{class:'nowline', style:'left:'+nowPct+'%'}));
    }
    const total = sleepMinutesOn(k);
    band.setAttribute('aria-label', dayLabel(k)+': '+fmtDur(total*60000)+' of sleep');
    const row = el('div',{class:'band-row'+(k===today?' today':'')},[
      el('span',{class:'dl', text: keyToDate(k).toLocaleDateString(undefined,{weekday:'short'})}),
      band
    ]);
    c.appendChild(row);
  });
  c.appendChild(el('div',{class:'heat-ax', style:'padding-left:38px'},[
    el('span',{text:'12a'}),el('span',{text:'6a'}),el('span',{text:'12p'}),el('span',{text:'6p'}),el('span',{text:'12a'})
  ]));
  c.appendChild(el('div',{style:'display:flex;gap:12px;margin-top:8px;flex-wrap:wrap'},[
    el('span',{style:'display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)'},[
      el('span',{style:'width:9px;height:9px;border-radius:2px;background:var(--c-sleep)'}), el('span',{text:'Asleep'})]),
    el('span',{style:'display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)'},[
      el('span',{style:'width:9px;height:9px;border-radius:2px;background:var(--c-crate)'}), el('span',{text:'Asleep in the crate'})])
  ]));

  // where she naps — the crate-training angle
  const placed = allEvents().filter(e=>e.type==='sleep' && e.where);
  if(placed.length >= 3){
    const counts = {};
    placed.forEach(e=> counts[e.where]=(counts[e.where]||0)+1);
    const inCrate = Math.round(100*(counts.crate||0)/placed.length);
    const rows = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:14px 0 6px', text:'Where she naps'}));
    const maxN = counts[rows[0]];
    rows.forEach(k=>{
      const label = (NAP_WHERE.find(x=>x[0]===k)||[,k])[1];
      c.appendChild(el('div',{style:'display:flex;align-items:center;gap:9px;padding:4px 0'},[
        el('span',{style:'font-size:13px;flex:0 0 44%', text:label}),
        el('span',{style:'flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden'},[
          el('span',{style:'display:block;height:100%;border-radius:4px;width:'+Math.round(100*counts[k]/maxN)+'%;background:'+(k==='crate'?'var(--c-crate)':'var(--c-sleep)')})
        ]),
        el('span',{class:'count', text:counts[k]+'×'})
      ]));
    });
    c.appendChild(el('div',{class:'hint', style:'margin-top:8px', text: inCrate >= 50
      ? inCrate+'% of her naps are in the crate. That is the cheapest crate training there is — she is building the association asleep rather than protesting.'
      : 'Only '+inCrate+'% of her naps are in the crate. Putting her down in there when she is already drowsy is far easier than asking her to settle wide awake, and it moves the ladder above along without a fight.'}));
  }

  // did overtiredness precede the bad crate sessions?
  const crates = allEvents().filter(e=>e.type==='crate' && e.outcome && e.endAt);
  const bad = crates.filter(e=> !OUTCOME_OK[e.outcome]);
  if(bad.length >= 2){
    const sess = sleepSessions();
    const awakeBefore = e => {
      const start = new Date(e.at).getTime();
      const prior = sess.filter(s=> s.end <= start).map(s=>s.end);
      return prior.length ? (start - Math.max.apply(null, prior))/60000 : null;
    };
    const tired = bad.map(awakeBefore).filter(v=> v!==null && v > ceiling).length;
    if(tired >= 2){
      c.appendChild(el('div',{class:'banner', style:'margin-top:12px', html: svg('info') +
        '<span>'+tired+' of her '+bad.length+' rough crate sessions started after she had already been awake past that ceiling. Worth trying the crate earlier, while she is drowsy, before blaming the crate itself.</span>'}));
    }
  }
  return c;
}

/* Commands board. A cue counts as solid when her last three sessions averaged
   4.5 or better; "learning" once there is a session on the board at all. */
function cueStats(){
  const by = {};
  allEvents().filter(e=>e.type==='training' && e.cue).forEach(e=>{
    const k = e.cue.trim();
    (by[k] || (by[k] = {cue:k, sessions:[]})).sessions.push(e);
  });
  return Object.keys(by).map(k=>{
    const s = by[k].sessions.sort((a,b)=> new Date(b.at)-new Date(a.at));
    const recent = s.slice(0,3).filter(e=>e.score);
    const avg = recent.length? recent.reduce((t,e)=>t+e.score,0)/recent.length : 0;
    const all = s.filter(e=>e.score);
    const allAvg = all.length? all.reduce((t,e)=>t+e.score,0)/all.length : 0;
    return {cue:k, n:s.length, avg, allAvg, last:s[0].at,
      status: (recent.length>=3 && avg>=4.5) ? 'solid' : (recent.length && avg>=3.5) ? 'nearly' : 'learning'};
  });
}
function focusCommands(){
  const c = el('div',{class:'card', style:'--tc:var(--c-training)'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 10px'},[
    el('h2',{text:'Commands'}), el('span',{class:'rule'}),
    el('button',{class:'act', text:'Clicker', onclick:()=>openClicker()})
  ]));
  const stats = cueStats();
  const byCue = {}; stats.forEach(s=> byCue[s.cue.toLowerCase()] = s);
  const solid = stats.filter(s=>s.status==='solid').length;

  c.appendChild(el('div',{style:'display:flex;align-items:baseline;gap:10px;margin-bottom:12px'},[
    el('span',{style:'font-family:var(--mono);font-size:34px;font-weight:500;line-height:1;color:var(--c-training)', text: solid+'/'+CUES.length}),
    el('span',{style:'font-size:13px;color:var(--ink-2);max-width:28ch', text: solid
      ? 'cues solid — three sessions in a row at four or better.'
      : 'cues solid. Tap any card below to log a session against it.'})
  ]));

  const board = el('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px'});
  CUES.forEach(cue=>{
    const s = byCue[cue.toLowerCase()];
    const st = s? s.status : 'none';
    const style = {
      solid:'border-color:var(--c-good);background:color-mix(in srgb,var(--c-good) 12%,var(--surface))',
      nearly:'border-color:var(--c-training);background:color-mix(in srgb,var(--c-training) 10%,var(--surface))',
      learning:'border-color:var(--line-strong)',
      none:'border-style:dashed;opacity:.72'
    }[st];
    const b = el('button',{style:'text-align:left;padding:9px 10px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);'+style,
      onclick:()=>{ const d = openLogSheet('training'); setTimeout(()=>{ const i = document.getElementById('trCue'); if(i){ i.value = cue; i.dispatchEvent(new Event('input')); } },0); }});
    b.appendChild(el('div',{style:'font-weight:600;font-size:13px;line-height:1.2', text:cue}));
    b.appendChild(el('div',{class:'count', style:'margin-top:3px', text: s
      ? s.n+' session'+(s.n===1?'':'s')+' · '+(s.allAvg? s.allAvg.toFixed(1)+'/5' : '–')
      : 'not started'}));
    if(s) b.appendChild(el('div',{style:'height:4px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden'},[
      el('div',{style:'height:100%;width:'+Math.round(100*(s.allAvg/5))+'%;border-radius:2px;background:'+(st==='solid'?'var(--c-good)':'var(--c-training)')})
    ]));
    board.appendChild(b);
  });
  c.appendChild(board);

  const lessons = allEvents().filter(e=>e.type==='training' && e.lesson);
  if(lessons.length){
    c.appendChild(el('div',{class:'hint', style:'margin-top:10px', text:'Latest lesson logged: '+lessons[0].lesson+'.'}));
  }

  const stale = stats.filter(s=> s.status!=='solid' && (Date.now()-new Date(s.last).getTime()) > 5*864e5).sort((a,b)=> new Date(a.last)-new Date(b.last))[0];
  if(stale) c.appendChild(el('div',{class:'hint', style:'margin-top:10px', text:'"'+stale.cue+'" has not come up in '+Math.round((Date.now()-new Date(stale.last).getTime())/864e5)+' days. Half-learned cues fade fastest — a two-minute refresher is usually enough.'}));
  else if(stats.length) c.appendChild(el('div',{class:'hint', style:'margin-top:10px', text:'Two or three short sessions a day beat one long one at this age — she has a few minutes of real attention in her, not twenty.'}));
  return c;
}

function focusTeething(){
  const c = el('div',{class:'card', style:'--tc:var(--c-chew)'});
  c.appendChild(el('div',{class:'sec-head', style:'margin:0 0 10px'},[
    el('h2',{text:'Teething'}), el('span',{class:'rule'})
  ]));
  const chews = allEvents().filter(e=>e.type==='chew');
  const m = ageMonths();
  if(m!==null){
    c.appendChild(el('div',{style:'font-size:13.5px;color:var(--ink-2);margin-bottom:12px;max-width:60ch',
      text: m < 6
        ? 'She is in it — puppy teeth come out and adult teeth come in between roughly three and six months, and the worst of the chewing usually sits right in the middle. Expect it to ease off around six months.'
        : 'The adult teeth should be through by now. If she is still chewing hard, it is habit or boredom rather than sore gums — which is a different fix.'}));
  }
  if(!chews.length){
    c.appendChild(el('div',{class:'hint', text:'Tap Chew on the Log tab each time you hand her a Kong, a teething stick or a chew toy, with how long she stayed with it. After a week or two this card ranks them by what actually buys you peace.'}));
    return c;
  }
  const by = {};
  chews.forEach(e=>{
    const k = e.chewKind || 'other';
    const g = by[k] || (by[k] = {k, n:0, mins:[], good:0});
    g.n++;
    if(e.minutes) g.mins.push(e.minutes);
    if(e.effect==='settled' || e.effect==='busy') g.good++;
  });
  const rows = Object.keys(by).map(k=>{
    const g = by[k];
    return {k, n:g.n, avg: g.mins.length? g.mins.reduce((a,b)=>a+b,0)/g.mins.length : 0, rate: g.good/g.n};
  }).sort((a,b)=> b.avg - a.avg);
  const max = Math.max.apply(null, rows.map(r=>r.avg).concat([1]));

  c.appendChild(el('div',{style:'font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px', text:'What holds her attention'}));
  rows.forEach(r=>{
    const label = (CHEW_KINDS.find(x=>x[0]===r.k)||[,r.k])[1];
    c.appendChild(el('div',{style:'display:flex;align-items:center;gap:9px;padding:5px 0'},[
      el('span',{style:'font-size:13px;flex:0 0 44%;line-height:1.25', text:label}),
      el('span',{style:'flex:1;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden'},[
        el('span',{style:'display:block;height:100%;border-radius:5px;width:'+Math.round(100*r.avg/max)+'%;background:var(--c-chew)'})
      ]),
      el('span',{class:'count', style:'flex:0 0 auto', text: (r.avg? Math.round(r.avg)+'m' : '–')+' · '+r.n+'×'})
    ]));
  });
  const best = rows[0];
  if(best && best.avg){
    c.appendChild(el('div',{class:'hint', style:'margin-top:8px',
      text:'"'+(CHEW_KINDS.find(x=>x[0]===best.k)||[,best.k])[1]+'" holds her longest, around '+Math.round(best.avg)+' minutes. Worth keeping two in the freezer — cold is half of why it works.'}));
  }
  const guard = chews.filter(e=>e.effect==='guard').length;
  if(guard>1) c.appendChild(el('div',{class:'banner', style:'margin-top:10px', html: svg('info') +
    '<span>She has got possessive over a chew '+guard+' times. Worth trading up — offering something better in exchange rather than taking it — and worth raising with a trainer early rather than late.</span>'}));
  const signs = {};
  chews.forEach(e=> (e.teething||[]).forEach(t=> signs[t]=(signs[t]||0)+1));
  const sk = Object.keys(signs);
  if(sk.length){
    const row = el('div',{class:'chips', style:'margin-top:10px'});
    sk.sort((a,b)=>signs[b]-signs[a]).forEach(k=> row.appendChild(el('span',{class:'chip', style:'cursor:default;font-size:12px', text:k+' · '+signs[k]})));
